<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZelAuto · Console do Operador</title>
<link rel="icon" type="image/svg+xml" href="../assets/zelauto-logo.svg">
<style>
  :root{--bg:#0A0A0B;--sf:#141416;--sf2:#1E1E21;--ln:#2A2A2D;--tx:#F4F4F3;--tx2:#9A9A94;--az:#F79A1B;--sobre-az:#17130A;--ok:#31A97C;--bad:#E0574B}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  a{color:var(--az)}
  .wrap{max-width:1000px;margin:0 auto;padding:22px}
  header{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--ln)}
  header b{font-size:18px}header .tag{font-size:12px;color:var(--tx2);border:1px solid var(--ln);border-radius:20px;padding:2px 10px}
  header .sair{margin-left:auto;font-size:13px;color:var(--tx2);background:none;border:1px solid var(--ln);border-radius:8px;padding:7px 12px;cursor:pointer}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 0 8px}
  .kpis-neg{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  @media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px}
  .kpi .n{font-size:26px;font-weight:700;letter-spacing:-.02em}.kpi .l{font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
  .kpi .n.warn{color:var(--az)}.kpi .n.bad{color:var(--bad)}
  .sec-t{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);margin:22px 0 12px}
  .acts{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .btn{background:var(--az);color:var(--sobre-az);border:0;border-radius:9px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer}
  .btn.g{background:var(--sf2);color:var(--tx);border:1px solid var(--ln)}
  .btn:disabled{opacity:.6;cursor:default}
  table{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--ln);font-size:14px}
  th{font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
  tr:last-child td{border-bottom:0}
  td .pill{font-size:12px;padding:2px 9px;border-radius:20px;background:rgba(49,169,124,.15);color:#7fe0b8}
  td .pill.off{background:rgba(224,87,75,.15);color:#f0a29a}
  .mono{font-family:ui-monospace,Menlo,monospace}
  .field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--tx2);margin-bottom:5px}
  .field input,.field select{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:15px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  #ov{position:fixed;inset:0;background:rgba(9,12,15,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:24px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
  .card h2{font-size:19px;margin-bottom:4px}.card p.sub{color:var(--tx2);font-size:14px;margin-bottom:16px}
  .card .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .erro{color:#f0a29a;font-size:13px;margin:8px 0;display:none}
  .okbox{background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-top:8px;font-size:14px}
  .okbox .l{color:var(--tx2);font-size:12px}.okbox .v{font-family:ui-monospace,monospace;font-size:15px;user-select:all}
  #login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
  .hint{font-size:12px;color:var(--tx2);margin-top:6px}
  .empty{padding:26px;text-align:center;color:var(--tx2)}
</style>
</head>
<body>

<!-- Login do operador -->
<div id="login">
  <form class="card" id="loginForm" style="max-width:360px">
    <div style="display:flex;align-items:center;justify-content:center;gap:2px;font:800 27px/1 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:-.04em;margin-bottom:8px">zelaut<img src="../assets/zelauto-anel.svg" alt="o" style="height:22px;width:22px"></div>
    <p class="sub" style="text-align:center">Console do Operador · acesso restrito.</p>
    <div class="field"><label>E-mail</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label>Senha</label><input id="lSenha" type="password" autocomplete="current-password" required></div>
    <div class="erro" id="lErro"></div>
    <button class="btn" id="lBtn" type="submit" style="width:100%">Entrar</button>
  </form>
</div>

<!-- App -->
<div id="app" style="display:none">
  <header>
    <img src="../assets/zelauto-logo.svg" alt="ZelAuto" style="height:32px;width:32px;border-radius:8px">
    <b style="letter-spacing:-.03em">zelauto</b><span class="tag">Console do Operador</span>
    <button class="sair" id="btnSair">Sair</button>
  </header>
  <div class="wrap">
    <div class="sec-t">Seu negócio · ZelAuto</div>
    <div class="kpis kpis-neg" id="kpisNeg"></div>
    <div class="acts">
      <button class="btn" id="btnNova">+ Nova loja</button>
      <button class="btn g" id="btnOperador">+ Operador</button>
      <button class="btn g" id="btnSenha">Resetar senha</button>
      <button class="btn g" id="btnImportar">Importar dados</button>
      <button class="btn g" id="btnAtualizar">Atualizar</button>
    </div>
    <div class="sec-t">Operação · por loja</div>
    <div class="kpis" id="kpisOp"></div>
    <table>
      <thead><tr><th>Loja</th><th>Endereço</th><th>Veículos</th><th>Clientes</th><th>Vendas</th><th>Status</th></tr></thead>
      <tbody id="linhas"><tr><td colspan="6" class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>
</div>

<!-- Overlay de modais -->
<div id="ov"><div class="card" id="ovCard"></div></div>

<script src="../app/dados.config.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const cfg = window.ZELAUTO_CONFIG;
const APP_URL = (cfg && cfg.appUrl) || '../app/zelauto.html';   // link do painel do lojista
if(!cfg || !cfg.url || !cfg.anonKey){ document.getElementById('lErro').style.display='block'; document.getElementById('lErro').textContent='Falta ../app/dados.config.js com url e anonKey.'; }
const sb = cfg && cfg.url ? createClient(cfg.url, cfg.anonKey) : null;

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function chamar(acao, extra){
  const { data, error } = await sb.functions.invoke('admin', { body: { acao, ...(extra||{}) } });
  if(error){
    let msg = error.message||'erro';
    try{ if(error.context && error.context.json){ const j=await error.context.json(); if(j&&j.error) msg=j.error; } }catch(_){}
    throw new Error(msg);
  }
  if(data && data.error) throw new Error(data.error);
  return data;
}

/* ---------------- login ---------------- */
$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  if(!sb) return;
  const btn=$('#lBtn'), erro=$('#lErro'); erro.style.display='none';
  btn.disabled=true; btn.textContent='Entrando…';
  try{
    await sb.auth.signInWithPassword({ email:$('#lEmail').value.trim(), password:$('#lSenha').value });
    await entrar();
  }catch(err){
    erro.textContent = (err && /operador/.test(err.message||'')) ? err.message : 'E-mail ou senha inválidos.';
    erro.style.display='block';
  }finally{ btn.disabled=false; btn.textContent='Entrar'; }
});

async function entrar(){
  // valida que é operador chamando métricas (a função barra quem não é). Se não
  // for operador, encerra a sessão para não deixar um login válido pendurado.
  let m;
  try{ m = await chamar('metricas'); }
  catch(err){ try{ await sb.auth.signOut(); }catch(_){} throw err; }
  $('#login').style.display='none'; $('#app').style.display='block';
  render(m);
}

$('#btnSair').onclick = async ()=>{ try{ await sb.auth.signOut(); }catch(_){} location.reload(); };
$('#btnAtualizar').onclick = async ()=>{ try{ render(await chamar('metricas')); }catch(e){ alert(e.message); } };

/* ---------------- render KPIs + lista ---------------- */
const brl = c => 'R$ ' + ((c||0)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const tile = (l,v,cls) => `<div class="kpi"><div class="n ${cls||''}">${v}</div><div class="l">${l}</div></div>`;
function render(m){
  const n=m.negocio||{}, t=m.totais||{lojas:0,veiculos:0,clientes:0,vendas:0};
  // Bloco financeiro do negócio ZelAuto (vem das assinaturas).
  $('#kpisNeg').innerHTML = [
    tile('MRR (recorrente/mês)', brl(n.mrr_centavos)),
    tile('Assinantes ativos', n.ativa||0),
    tile('Em trial', n.trial||0),
    tile('Vencendo ≤3 dias', n.vencendo_3d||0, (n.vencendo_3d>0?'warn':'')),
    tile('Suspensas', n.suspensa||0, (n.suspensa>0?'bad':'')),
    tile('Sem plano ainda', n.sem_plano||0),
  ].join('');
  // Bloco operacional (contagens por loja).
  $('#kpisOp').innerHTML = [
    tile('Lojas', t.lojas), tile('Veículos', t.veiculos), tile('Clientes', t.clientes), tile('Vendas', t.vendas)
  ].join('');
  const ls=m.lojas||[];
  $('#linhas').innerHTML = ls.length ? ls.map(l=>`
    <tr>
      <td><b>${esc(l.nome)}</b></td>
      <td class="mono">${l.slug?('?loja='+esc(l.slug)):'<span style="color:var(--tx2)">—</span>'}</td>
      <td>${l.veiculos}</td><td>${l.clientes}</td><td>${l.vendas}</td>
      <td>${l.ativa?'<span class="pill">ativa</span>':'<span class="pill off">inativa</span>'}</td>
    </tr>`).join('') : `<tr><td colspan="6" class="empty">Nenhuma loja ainda. Clique em “Nova loja”.</td></tr>`;
}

/* ---------------- modais ---------------- */
function abrir(html){ $('#ovCard').innerHTML=html; $('#ov').style.display='flex'; }
function fechar(){ $('#ov').style.display='none'; $('#ovCard').innerHTML=''; }
$('#ov').addEventListener('click', e=>{ if(e.target.id==='ov') fechar(); });
window.fecharOv = fechar;

/* Nova loja */
$('#btnNova').onclick = ()=>{
  abrir(`
    <h2>Nova loja</h2>
    <p class="sub">Cria a loja e o login do dono. Banco limpo.</p>
    <div class="field"><label>Nome da loja</label><input id="nLoja" placeholder="Vancar Veículos"></div>
    <div class="f2">
      <div class="field"><label>Endereço (slug)</label><input id="nSlug" placeholder="vancar"></div>
      <div class="field"><label>CNPJ</label><input id="nCnpj" placeholder="00.000.000/0001-00"></div>
    </div>
    <div class="f2">
      <div class="field"><label>Cidade</label><input id="nCidade" placeholder="Salvador"></div>
      <div class="field"><label>UF</label><input id="nUf" placeholder="BA" maxlength="2"></div>
    </div>
    <div class="f2">
      <div class="field"><label>Telefone / WhatsApp</label><input id="nTel" placeholder="71 99999-9999"></div>
      <div class="field"><label>Cor da marca (site)</label><input id="nCor" type="text" placeholder="#F79A1B"></div>
    </div>
    <div class="f2">
      <div class="field"><label>Nome do dono</label><input id="nDono" placeholder="Danilo"></div>
      <div class="field"><label>E-mail do dono</label><input id="nEmail" type="email" placeholder="dono@loja.com"></div>
    </div>
    <p class="hint">CNPJ, cidade e UF são o que a NF-e e o site da loja usam. Pode deixar em branco e preencher depois nas configurações da loja.</p>
    <div class="erro" id="nErro"></div>
    <div class="foot">
      <button class="btn g" onclick="fecharOv()">Cancelar</button>
      <button class="btn" id="nBtn">Criar loja</button>
    </div>`);
  $('#nSlug').addEventListener('input', e=>{ e.target.value=e.target.value.toLowerCase().replace(/[^a-z0-9-]/g,''); });
  $('#nUf').addEventListener('input', e=>{ e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,''); });
  $('#nBtn').onclick = criarLoja;
};

async function criarLoja(){
  const erro=$('#nErro'); erro.style.display='none';
  const btn=$('#nBtn'); btn.disabled=true; btn.textContent='Criando…';
  try{
    const r = await chamar('criar_loja', {
      nome:$('#nLoja').value.trim(), slug:$('#nSlug').value.trim(), cor:$('#nCor').value.trim(),
      cnpj:$('#nCnpj').value.trim(), cidade:$('#nCidade').value.trim(), uf:$('#nUf').value.trim(), telefone:$('#nTel').value.trim(),
      dono:{ nome:$('#nDono').value.trim(), email:$('#nEmail').value.trim() },
    });
    const link = APP_URL + (APP_URL.includes('?')?'&':'?') + 'loja=' + encodeURIComponent(r.slug);
    abrir(`
      <h2>Loja criada ✅</h2>
      <p class="sub">Passe estes dados ao dono. A senha aparece uma vez.</p>
      <div class="okbox"><div class="l">Link de acesso da loja</div><div class="v">${esc(link)}</div></div>
      <div class="okbox"><div class="l">E-mail</div><div class="v">${esc(r.email)}</div></div>
      <div class="okbox"><div class="l">Senha provisória</div><div class="v">${esc(r.senha)}</div></div>
      <p class="sub" style="margin-top:12px;line-height:1.55">Diga ao dono para <b>trocar a senha no primeiro acesso</b> (Configurações › Conta). Depois disso, esta senha provisória para de valer e você não fica com o acesso dele. Cada loja é isolada no banco — você não entra na conta do lojista nem vê os números de negócio dele por aqui.</p>
      <div class="foot"><button class="btn" onclick="fecharOv()">Concluir</button></div>`);
    try{ render(await chamar('metricas')); }catch(_){}
  }catch(err){ erro.textContent=err.message; erro.style.display='block'; btn.disabled=false; btn.textContent='Criar loja'; }
}

/* Novo operador (staff com acesso ao Console) */
$('#btnOperador').onclick = ()=>{
  abrir(`
    <h2>Novo operador</h2>
    <p class="sub">Cria (ou promove) um acesso ao Console. Operadores mexem em tudo.</p>
    <div class="field"><label>Nome</label><input id="oNome" placeholder="Pedro"></div>
    <div class="field"><label>E-mail</label><input id="oEmail" type="email" placeholder="socio@zelauto.com"></div>
    <div class="erro" id="oErro"></div>
    <div class="foot">
      <button class="btn g" onclick="fecharOv()">Cancelar</button>
      <button class="btn" id="oBtn">Criar operador</button>
    </div>`);
  $('#oBtn').onclick = async ()=>{
    const erro=$('#oErro'); erro.style.display='none';
    const b=$('#oBtn'); b.disabled=true; b.textContent='Criando…';
    try{
      const r = await chamar('criar_operador', { nome:$('#oNome').value.trim(), email:$('#oEmail').value.trim() });
      abrir(`
        <h2>${r.promovido?'Promovido a operador ✅':'Operador criado ✅'}</h2>
        <div class="okbox"><div class="l">E-mail</div><div class="v">${esc(r.email)}</div></div>
        ${r.senha?`<div class="okbox"><div class="l">Senha provisória</div><div class="v">${esc(r.senha)}</div></div>
        <p class="sub" style="margin-top:12px">Passe estes dados ao operador. Ele entra no Console e deve trocar a senha.</p>`
        :`<p class="sub" style="margin-top:12px">A conta já existia — só foi promovida a operador. A senha atual dela continua valendo.</p>`}
        <div class="foot"><button class="btn" onclick="fecharOv()">Concluir</button></div>`);
    }catch(err){ erro.textContent=err.message; erro.style.display='block'; b.disabled=false; b.textContent='Criar operador'; }
  };
};

/* Resetar senha de qualquer conta (recuperação de acesso) */
$('#btnSenha').onclick = ()=>{
  abrir(`
    <h2>Resetar senha</h2>
    <p class="sub">Redefine a senha de qualquer conta ZelAuto (sua, de um operador ou de um lojista). Fica registrado.</p>
    <div class="field"><label>E-mail da conta</label><input id="sEmail" type="email" placeholder="pessoa@exemplo.com"></div>
    <div class="field"><label>Nova senha <span style="opacity:.6">(em branco = gera uma provisória)</span></label><input id="sSenha" type="text" placeholder="deixe em branco para gerar"></div>
    <div class="erro" id="sErro"></div>
    <div class="foot">
      <button class="btn g" onclick="fecharOv()">Cancelar</button>
      <button class="btn" id="sBtn">Redefinir</button>
    </div>`);
  $('#sBtn').onclick = async ()=>{
    const erro=$('#sErro'); erro.style.display='none';
    const b=$('#sBtn'); b.disabled=true; b.textContent='Redefinindo…';
    try{
      const r = await chamar('resetar_senha', { email:$('#sEmail').value.trim(), nova_senha:$('#sSenha').value });
      abrir(`
        <h2>Senha redefinida ✅</h2>
        <div class="okbox"><div class="l">E-mail</div><div class="v">${esc(r.email)}</div></div>
        <div class="okbox"><div class="l">Senha</div><div class="v">${esc(r.senha)}</div></div>
        <p class="sub" style="margin-top:12px">Passe ao dono da conta. Peça para ele trocar no primeiro acesso.</p>
        <div class="foot"><button class="btn" onclick="fecharOv()">Concluir</button></div>`);
    }catch(err){ erro.textContent=err.message; erro.style.display='block'; b.disabled=false; b.textContent='Redefinir'; }
  };
};

/* Importar (CSV genérico) */
let _lojasCache=[];
$('#btnImportar').onclick = async ()=>{
  try{ const m=await chamar('metricas'); _lojasCache=m.lojas||[]; }catch(_){ _lojasCache=[]; }
  abrir(`
    <h2>Importar dados</h2>
    <p class="sub">Sobe um CSV do sistema atual do lojista. O cabeçalho vira o mapa das colunas.</p>
    <div class="field"><label>Loja de destino</label><select id="iLoja">
      ${_lojasCache.map(l=>`<option value="${esc(l.id)}">${esc(l.nome)}</option>`).join('')||'<option value="">— nenhuma loja —</option>'}
    </select></div>
    <div class="field"><label>Tipo</label><select id="iTipo">
      <option value="veiculos">Estoque (veículos)</option>
      <option value="clientes">Clientes</option>
    </select></div>
    <div class="field"><label>Arquivo CSV</label><input id="iArq" type="file" accept=".csv,text/csv"></div>
    <div class="hint" id="iHint">Estoque: colunas marca, modelo, ano, placa, km, cor, compra, alvo. Clientes: nome, telefone, origem, interesse, orcamento.</div>
    <div class="erro" id="iErro"></div>
    <div class="foot">
      <button class="btn g" onclick="fecharOv()">Cancelar</button>
      <button class="btn" id="iBtn">Importar</button>
    </div>`);
  $('#iTipo').addEventListener('change', e=>{
    $('#iHint').textContent = e.target.value==='veiculos'
      ? 'Estoque: colunas marca, modelo, ano, placa, km, cor, compra, alvo.'
      : 'Clientes: colunas nome, telefone, origem, interesse, orcamento.';
  });
  $('#iBtn').onclick = importar;
};

// parser CSV compacto: aspas, vírgulas e quebras dentro de campo
function parseCSV(txt){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<txt.length;i++){ const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c==='\r'){ /* ignora */ }
    else cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
const norm = s => String(s||'').trim().toLowerCase().normalize('NFD').split('').filter(c=>{const k=c.charCodeAt(0);return k<0x300||k>0x36f;}).join('');

async function importar(){
  const erro=$('#iErro'); erro.style.display='none';
  const lojaId=$('#iLoja').value, tipo=$('#iTipo').value, arq=$('#iArq').files[0];
  if(!lojaId){ erro.textContent='Escolha a loja de destino.'; erro.style.display='block'; return; }
  if(!arq){ erro.textContent='Selecione um arquivo CSV.'; erro.style.display='block'; return; }
  const btn=$('#iBtn'); btn.disabled=true; btn.textContent='Importando…';
  try{
    const txt = await arq.text();
    const rows = parseCSV(txt);
    if(rows.length<2) throw new Error('CSV sem linhas de dados.');
    const head = rows[0].map(norm);
    const idx = nomes => { for(const n of nomes){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
    const get = (r,i)=> i>=0 ? String(r[i]||'').trim() : '';
    const dados = rows.slice(1).map(r=>{
      if(tipo==='veiculos'){
        return { marca:get(r,idx(['marca'])), modelo:get(r,idx(['modelo'])),
          ano:get(r,idx(['ano','ano_fab','anofabricacao'])), placa:get(r,idx(['placa'])),
          km:get(r,idx(['km','quilometragem'])), cor:get(r,idx(['cor'])),
          compra:get(r,idx(['compra','valor_compra','custo','valorpago'])),
          alvo:get(r,idx(['alvo','preco','preco_venda','anuncio','valor'])) };
      }
      return { nome:get(r,idx(['nome','cliente'])), telefone:get(r,idx(['telefone','tel','celular','whatsapp'])),
        origem:get(r,idx(['origem','fonte'])), interesse:get(r,idx(['interesse','carro','veiculo'])),
        orcamento:get(r,idx(['orcamento','orçamento','budget'])) };
    });
    const payload = tipo==='veiculos' ? { loja_id:lojaId, veiculos:dados } : { loja_id:lojaId, clientes:dados };
    const r = await chamar('importar', payload);
    const pul = r.veiculos_pulados ? ` (${r.veiculos_pulados} pulado(s) por placa repetida)` : '';
    abrir(`<h2>Importado ✅</h2><p class="sub">Entraram na loja: ${r.veiculos||0} veículo(s)${pul}, ${r.clientes||0} cliente(s).</p>
      <div class="foot"><button class="btn" onclick="fecharOv()">Concluir</button></div>`);
    try{ render(await chamar('metricas')); }catch(_){}
  }catch(err){ erro.textContent=err.message; erro.style.display='block'; btn.disabled=false; btn.textContent='Importar'; }
}

/* ---------------- boot ---------------- */
(async ()=>{
  if(!sb) return;
  try{
    const { data } = await sb.auth.getSession();
    if(data && data.session){ await entrar(); }
  }catch(_){}
})();
</script>
