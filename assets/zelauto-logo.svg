<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="ZelAuto">
  <defs>
    <mask id="anel">
      <rect width="100" height="100" fill="#000"/>
      <circle cx="50" cy="50" r="32" fill="#fff"/>
      <circle cx="50" cy="50" r="18.5" fill="#000"/>
    </mask>
  </defs>
  <!-- fundo preto arredondado (funciona como favicon e sobre qualquer cor) -->
  <rect width="100" height="100" rx="24" fill="#000000"/>
  <!-- metade esquerda: branca -->
  <rect x="0" y="0" width="49.3" height="100" fill="#FFFFFF" mask="url(#anel)"/>
  <!-- metade direita: laranja da marca -->
  <rect x="50.7" y="0" width="49.3" height="100" fill="#F79A1B" mask="url(#anel)"/>
</svg>
