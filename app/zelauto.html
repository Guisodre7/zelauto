<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro" data-texto="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vancar Veículos">
<title>Vancar Veículos — Central de Gestão</title>
<link rel="icon" type="image/svg+xml" href="../assets/zelauto-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SISTEMA VISUAL — v3
   6 tamanhos de fonte · piso de 14px · todo cinza acima de 4,5:1
   ============================================================ */
:root{
  /* ---- escala tipográfica: SEIS tamanhos, nenhum abaixo de 12 ---- */
  --t-hero:30px;   /* número principal da tela */
  --t-num:22px;    /* número de card */
  --t-tit:17px;    /* título */
  --t-txt:15px;    /* corpo */
  --t-sup:14px;    /* apoio — PISO de leitura */
  --t-lab:12px;    /* rótulo, só caixa-alta curta */

  --r:14px; --r-sm:10px; --sb:236px;
  --toque:48px;    /* alvo mínimo de toque */

  /* aliases semânticos usados nos HTML gerados por JS (resolvem por tema) */
  --placa:var(--tx); --placa-2:var(--tx2); --placa-3:var(--tx3); --asfalto:var(--sf2);
  /* texto legível sobre o laranja da marca (botões/realces sólidos) */
  --sobre-az:#17130A;
}
html[data-texto="grande"]{
  --t-hero:34px; --t-num:25px; --t-tit:19px; --t-txt:17px; --t-sup:16px; --t-lab:13px;
}
html[data-texto="maior"]{
  --t-hero:38px; --t-num:28px; --t-tit:21px; --t-txt:19px; --t-sup:18px; --t-lab:14px;
}

/* ---- TEMA ESCURO ---- */
html[data-tema="escuro"]{
  --bg:#0A0A0B; --sf:#141416; --sf2:#1E1E21; --ln:#2A2A2D; --ln2:#3A3A3F;
  --tx:#F4F4F3; --tx2:#B6B5B1; --tx3:#8A8A86;
  --az:#F79A1B; --az-fb:#2A1D08; --az-sol:#F79A1B;
  --am:#F5B44D; --am-fb:#3A2C11;
  --vd:#4ECFA0; --vd-fb:#123024;
  --vm:#FF8A7D; --vm-fb:#3B1B18;
  --sombra:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -18px rgba(0,0,0,.9);
  --placa-bg:#F4F6F8; --placa-tx:#12161B;
}
/* ---- TEMA CLARO ---- */
html[data-tema="claro"]{
  --bg:#F4F4F2; --sf:#FFFFFF; --sf2:#F5F5F3; --ln:#E5E5E2; --ln2:#D0D0CC;
  --tx:#141413; --tx2:#57574F; --tx3:#6F6F68;
  --az:#B45309; --az-fb:#FBEFDC; --az-sol:#F79A1B;
  --am:#9A5D02; --am-fb:#FCF1DE;
  --vd:#0F6045; --vd-fb:#DFF3EA;
  --vm:#B02A1F; --vm-fb:#FBE4E1;
  --sombra:0 1px 2px rgba(16,24,40,.05), 0 8px 24px -16px rgba(16,24,40,.22);
  --placa-bg:#F4F6F8; --placa-tx:#12161B;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;max-width:100%;overflow:hidden;overscroll-behavior:none;position:relative}
body{
  background:var(--bg); color:var(--tx);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:var(--t-txt); line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-wrap:break-word;
  text-size-adjust:100%; -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* placa Mercosul — identidade de cada veículo */
.plate{display:inline-flex;flex-direction:column;width:70px;border-radius:5px;overflow:hidden;
  flex:none;background:var(--placa-bg);border:1.5px solid #C9D0D8;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.plate b{background:#2F6BE8;color:#fff;font-size:6px;letter-spacing:.14em;font-weight:700;
  text-align:center;padding:2px 0;line-height:1}
.plate span{color:var(--placa-tx);font-family:'IBM Plex Mono',monospace;font-weight:600;
  font-size:12px;letter-spacing:.05em;text-align:center;padding:3px 0 4px;line-height:1}
.plate.lg{width:88px}.plate.lg span{font-size:15px}.plate.lg b{font-size:7px}

/* ---------------- ESTRUTURA ---------------- */
.app{display:flex;height:100vh;height:100dvh;width:100%;max-width:100%;overflow:hidden;position:relative;z-index:1}

.sidebar{width:var(--sb);flex:none;background:var(--sf);border-right:1px solid var(--ln);
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:60;
  transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1)}
.sidebar.open{transform:none}
.sb-brand{padding:18px 16px 15px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:11px}
.sb-mark{width:38px;height:38px;border-radius:10px;flex:none;background:linear-gradient(150deg,#F79A1B,#B45309);
  color:#17130A;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-.06em}
.sb-name{font-weight:800;font-size:var(--t-tit);letter-spacing:-.02em;line-height:1.1}
.sb-sub{font-size:var(--t-lab);color:var(--tx3);font-weight:600;margin-top:1px}

.sb-nav{flex:1;overflow-y:auto;padding:12px 10px}
.navitem{display:flex;align-items:center;gap:13px;width:100%;min-height:var(--toque);
  padding:11px 12px;border-radius:var(--r-sm);color:var(--tx2);
  font-size:var(--t-txt);font-weight:500;text-align:left;transition:.14s;position:relative;margin-bottom:3px}
.navitem svg{width:21px;height:21px;flex:none;opacity:.9}
.navitem:hover{background:var(--sf2);color:var(--tx)}
.navitem.on{background:var(--az-fb);color:var(--az);font-weight:700}
.navitem.on svg{opacity:1}
.navitem.on::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--az)}
/* UM selo por vez — orçamento de alerta */
.navitem .tag{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:20px;
  background:var(--vm);color:#fff;font-size:var(--t-lab);font-weight:700;
  display:grid;place-items:center;font-family:'IBM Plex Mono',monospace}
html[data-tema="claro"] .navitem .tag{background:#B02A1F}
.navitem .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--tx3)}

.sb-ia{padding:8px 10px 0}
.ia-btn{width:100%;display:flex;align-items:center;gap:11px;padding:12px;min-height:var(--toque);
  border-radius:var(--r-sm);text-align:left;transition:.16s;background:var(--az-fb);
  border:1px solid var(--ln2)}
.ia-btn:hover{border-color:var(--az)}
.ia-dot{width:9px;height:9px;border-radius:50%;background:var(--vd);flex:none;
  box-shadow:0 0 0 3px rgba(78,207,160,.18);animation:pulse 2.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(78,207,160,0)}}
.ia-btn strong{display:block;font-size:var(--t-sup);font-weight:700}
.ia-btn small{display:block;font-size:var(--t-lab);color:var(--tx2)}

.sb-foot{padding:10px;border-top:1px solid var(--ln);display:flex;gap:8px;align-items:center}
.sb-foot .who{width:36px;height:36px;border-radius:10px;background:var(--sf2);border:1px solid var(--ln2);
  display:grid;place-items:center;font-size:var(--t-lab);font-weight:700;color:var(--tx2);flex:none}
.sb-foot .qm{flex:1;min-width:0}
.sb-foot .qm b{display:block;font-size:var(--t-sup);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-foot .qm span{font-size:var(--t-lab);color:var(--tx3)}
.gear{width:var(--toque);height:var(--toque);border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--tx2);flex:none}
.gear:hover{background:var(--sf2);color:var(--tx)}
.gear svg{width:21px;height:21px}

.scrim{position:fixed;inset:0;background:rgba(6,8,11,.6);backdrop-filter:blur(2px);z-index:55;
  opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}

.main{flex:1;min-width:0;height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--ln);
  padding:9px 14px;padding-top:max(9px,env(safe-area-inset-top));display:flex;align-items:center;gap:11px}
.burger{width:var(--toque);height:var(--toque);border-radius:var(--r-sm);border:1px solid var(--ln2);
  display:grid;place-items:center;flex:none;background:var(--sf)}
.burger svg{width:22px;height:22px}
.tb-title{min-width:0;flex:1}
.tb-title h1{font-size:var(--t-tit);font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-act{display:flex;gap:8px;flex:none}

/* ---- abas: no máximo 4, nível único ---- */
.tabs{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--ln);
  display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:12px 14px;font-size:var(--t-sup);font-weight:600;color:var(--tx3);
  white-space:nowrap;border-bottom:2.5px solid transparent;transition:.14s;min-height:var(--toque)}
.tabs button:hover{color:var(--tx2)}
.tabs button.on{color:var(--tx);border-bottom-color:var(--az)}
.tabs button .b{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;
  border-radius:20px;background:var(--vm);color:#fff;font-size:11px;font-weight:700;margin-left:6px;
  font-family:'IBM Plex Mono',monospace}
html[data-tema="claro"] .tabs button .b{background:#B02A1F}

.view{padding:15px 14px;padding-bottom:calc(40px + env(safe-area-inset-bottom));
  max-width:1200px;width:100%;margin:0 auto;display:none;animation:up .3s cubic-bezier(.2,.7,.3,1)}
.view.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(8px)}}

/* ---------------- COMPONENTES ---------------- */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sombra)}
.card-h{padding:14px 15px 0;display:flex;align-items:flex-start;gap:11px}
.card-h h3{font-size:var(--t-tit);font-weight:700;letter-spacing:-.015em;flex:1}
.card-h p{font-size:var(--t-sup);color:var(--tx2);margin-top:3px}
.card-b{padding:14px 15px}
.grid{display:grid;gap:12px;min-width:0}
.grid>*,.kpis>*,.f2>*{min-width:0}
.sec{margin-top:20px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:0 2px}
.sec-h h2{font-size:var(--t-lab);font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--tx2)}
.sec-h .rule{flex:1;height:1px;background:var(--ln)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--toque);
  padding:11px 16px;border-radius:11px;font-size:var(--t-txt);font-weight:600;
  background:var(--sf2);border:1px solid var(--ln2);color:var(--tx);transition:.15s}
.btn:hover{border-color:var(--tx3)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--az-sol);border-color:var(--az-sol);color:var(--sobre-az)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.danger{background:transparent;border-color:rgba(224,87,75,.5);color:#E0574B}
.btn.danger:hover{background:rgba(224,87,75,.1)}
.btn.amb{background:#F5B44D;border-color:#F5B44D;color:#201606}
.btn.sm{min-height:38px;padding:8px 12px;font-size:var(--t-sup);border-radius:9px}
.btn.gh{background:transparent}
.btn.blk{width:100%}
.btn:focus-visible,.navitem:focus-visible,.tabs button:focus-visible,input:focus-visible,
select:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2.5px solid var(--az);outline-offset:2px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;
  font-size:var(--t-lab);font-weight:700;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--vd-fb);color:var(--vd);border-color:var(--vd)}
.pill.warn{background:var(--am-fb);color:var(--am);border-color:var(--am)}
.pill.bad{background:var(--vm-fb);color:var(--vm);border-color:var(--vm)}
.pill.blue{background:var(--az-fb);color:var(--az);border-color:var(--az)}
.pill.mute{background:var(--sf2);color:var(--tx2);border-color:var(--ln2)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px;
  position:relative;overflow:hidden;box-shadow:var(--sombra)}
.kpi::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--ln)}
.kpi.j::after{background:#F5B44D}.kpi.b::after{background:var(--az)}
.kpi.g::after{background:var(--vd)}.kpi.r::after{background:var(--vm)}
.kpi .lab{font-size:var(--t-lab);letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);font-weight:700}
.kpi .val{font-size:var(--t-num);font-weight:600;margin-top:8px;letter-spacing:-.03em;line-height:1.1;overflow-wrap:anywhere}
.kpi .sub{font-size:var(--t-sup);color:var(--tx2);margin-top:5px}
.up{color:var(--vd)}.down{color:var(--vm)}

/* ---- HOJE: três números heróis ---- */
.hero3{display:grid;grid-template-columns:1fr;gap:11px}
.hero{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:16px 15px;
  box-shadow:var(--sombra);display:flex;align-items:center;gap:14px}
.hero .ic{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center}
.hero .ic svg{width:23px;height:23px}
.hero .gr{flex:1;min-width:0}
.hero .v{font-size:var(--t-hero);font-weight:600;letter-spacing:-.04em;line-height:1;overflow-wrap:anywhere}
.hero .l{font-size:var(--t-sup);color:var(--tx2);margin-top:5px}

/* ---- cartão de ação: todo alerta tem botão ---- */
.acao{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);
  padding:15px;box-shadow:var(--sombra);margin-bottom:11px}
.acao.vm{border-left:4px solid var(--vm)}
.acao.am{border-left:4px solid #F5B44D}
.acao.vd{border-left:4px solid var(--vd)}
.acao .tp{font-size:var(--t-lab);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.acao.vm .tp{color:var(--vm)}.acao.am .tp{color:var(--am)}.acao.vd .tp{color:var(--vd)}
.acao h4{font-size:var(--t-tit);font-weight:700;letter-spacing:-.015em;margin-bottom:5px}
.acao p{font-size:var(--t-txt);color:var(--tx2);line-height:1.55;margin-bottom:12px}
.acao p b{color:var(--tx);font-weight:600}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:11px;padding:13px 14px;border-top:1px solid var(--ln);transition:.13s;min-height:var(--toque)}
.row:first-child{border-top:0}
.row:hover{background:var(--sf2)}
.row .grow{flex:1;min-width:0}
.row .t{font-size:var(--t-txt);font-weight:600;letter-spacing:-.01em}
.row .s{font-size:var(--t-sup);color:var(--tx2)}
.row .r{text-align:right;flex:none}

.bar{height:7px;border-radius:20px;background:var(--sf2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:20px;background:var(--az);transition:width .8s cubic-bezier(.2,.8,.3,1)}
.bar i.amb{background:#F5B44D}.bar i.grn{background:var(--vd)}.bar i.red{background:var(--vm)}

.field{margin-bottom:14px}
.field label{display:block;font-size:var(--t-lab);font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--tx2);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;min-height:var(--toque);padding:12px 13px;
  border-radius:11px;background:var(--bg);border:1.5px solid var(--ln2);outline:none;
  transition:.15s;font-size:var(--t-txt)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--az)}
.field .hint{font-size:var(--t-sup);color:var(--tx2);margin-top:6px}
.busca{position:relative;margin:2px 0 12px}
.busca input{width:100%;min-height:var(--toque);padding:12px 13px 12px 42px;
  border-radius:11px;background:var(--bg);border:1.5px solid var(--ln2);outline:none;
  transition:.15s;font-size:var(--t-txt);color:inherit}
.busca input:focus{border-color:var(--az)}
.busca input::placeholder{color:var(--tx2)}
.busca .i20{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;color:var(--tx2);pointer-events:none}
.perm-h{display:flex;align-items:center;gap:8px;font-size:var(--t-lab);font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);margin:18px 0 8px}
.perm-h .btn.sm{margin-left:auto;font-weight:600}
.perm-h .btn.sm+.btn.sm{margin-left:0}
.perm-box{max-height:210px;overflow-y:auto;border:1.5px solid var(--ln2);
  border-radius:11px;padding:2px 12px;background:var(--bg)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 11px}
.rangewrap{display:flex;align-items:center;gap:12px}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;background:var(--ln2);
  border-radius:20px;padding:0;border:0;min-height:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
  background:#F5B44D;border:3px solid var(--sf);box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#F5B44D;
  border:3px solid var(--sf);cursor:pointer}
.rangeval{font-family:'IBM Plex Mono',monospace;font-size:var(--t-txt);font-weight:600;
  min-width:76px;text-align:right;color:var(--am)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none;
  max-width:100%;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 14px;border-radius:20px;border:1.5px solid var(--ln2);font-size:var(--t-sup);
  font-weight:600;color:var(--tx2);white-space:nowrap;flex:none;transition:.14s;background:var(--sf);min-height:40px}
.chip:hover{color:var(--tx);border-color:var(--tx3)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}

.modal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(6,8,11,.7);backdrop-filter:blur(3px)}
.modal-box{position:relative;background:var(--sf);border:1px solid var(--ln2);
  border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92dvh;
  display:flex;flex-direction:column;animation:sheet .3s cubic-bezier(.2,.8,.3,1)}
@keyframes sheet{from{transform:translateY(100%)}}
.modal-h{padding:16px 17px 13px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:11px}
.modal-h h3{flex:1;font-size:var(--t-tit);font-weight:700;letter-spacing:-.02em}
.modal-b{padding:16px 17px;overflow-y:auto;flex:1}
.modal-f{padding:12px 17px;padding-bottom:max(12px,env(safe-area-inset-bottom));
  border-top:1px solid var(--ln);display:flex;gap:9px}
.modal-f .btn{flex:1}
.x{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--tx2);flex:none}
.x:hover{background:var(--sf2);color:var(--tx)}
.x svg{width:20px;height:20px}
.grab{width:38px;height:4px;border-radius:20px;background:var(--ln2);margin:9px auto -5px}

.ia{position:fixed;inset:0;z-index:95;display:none}
.ia.on{display:block}
.ia-bg{position:absolute;inset:0;background:rgba(6,8,11,.7);backdrop-filter:blur(3px)}
.ia-panel{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:430px;background:var(--sf);
  border-left:1px solid var(--ln2);display:flex;flex-direction:column;animation:slide .3s cubic-bezier(.2,.8,.3,1)}
@keyframes slide{from{transform:translateX(100%)}}
.ia-h{padding:13px 15px;padding-top:max(13px,env(safe-area-inset-top));border-bottom:1px solid var(--ln);
  display:flex;align-items:center;gap:11px}
.ia-av{width:42px;height:42px;border-radius:12px;flex:none;background:linear-gradient(140deg,#26262B,#141416);
  border:1px solid var(--ln2);display:grid;place-items:center}
.ia-av svg{width:21px;height:21px;color:var(--az)}
.ia-h .grow strong{display:block;font-size:var(--t-tit);font-weight:700}
.ia-h .grow small{font-size:var(--t-sup);color:var(--tx2);display:flex;align-items:center;gap:5px}
.ia-body{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:90%;padding:12px 14px;border-radius:15px;font-size:var(--t-txt);line-height:1.6;
  white-space:pre-wrap;word-break:break-word}
.msg.bot{background:var(--sf2);border:1px solid var(--ln);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--az-sol);color:var(--sobre-az);border-bottom-right-radius:5px;align-self:flex-end}
.msg b{color:var(--am);font-weight:700}
.msg.me b{color:var(--sobre-az)}
.msg hr{border:0;border-top:1px solid var(--ln2);margin:10px 0}
.ia-f{padding:11px 13px;padding-bottom:max(11px,env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
.ia-input{display:flex;gap:8px;align-items:flex-end}
.ia-input textarea{flex:1;resize:none;max-height:110px;padding:12px 13px;border-radius:12px;
  background:var(--bg);border:1.5px solid var(--ln2);outline:none;font-size:var(--t-txt);min-height:var(--toque)}
.ia-input textarea:focus{border-color:var(--az)}
.ia-send{width:var(--toque);height:var(--toque);border-radius:12px;background:var(--az-sol);
  display:grid;place-items:center;flex:none;color:var(--sobre-az)}
.ia-send svg{width:19px;height:19px}
.typing{display:flex;gap:5px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--tx3);animation:blink 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

.insight{display:flex;gap:12px;padding:14px 15px;border-top:1px solid var(--ln)}
.insight:first-child{border-top:0}
.ic{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center}
.ic svg{width:19px;height:19px}
.ic.risk{background:var(--vm-fb);color:var(--vm)}
.ic.warn{background:var(--am-fb);color:var(--am)}
.ic.opp{background:var(--vd-fb);color:var(--vd)}
.ic.info{background:var(--az-fb);color:var(--az)}
.insight .t{font-size:var(--t-txt);font-weight:600}
/* qualquer ícone solto tem tamanho — senão o SVG estica e esmaga o texto ao lado */

/* ---------- miniatura do veículo ---------- */
:root{--sil1:#5A6674;--sil2:#39424F;--sil3:#2A303A;--sil4:#4C5765}
html[data-tema="claro"]{--sil1:#AEB8C4;--sil2:#8C97A5;--sil3:#6E7A88;--sil4:#B9C3CE}
.thumb{position:relative;display:block;width:84px;height:63px;flex:none;border-radius:9px;
  overflow:hidden;background:var(--sf2);border:1px solid var(--ln)}
.thumb.sm{width:64px;height:48px;border-radius:7px}
.thumb.lg{width:128px;height:96px;border-radius:11px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:100%;height:100%;display:block;padding:6px 4px 0}
.thumb .tpl{position:absolute;left:0;right:0;bottom:0;background:rgba(9,12,16,.82);
  color:#F2F4F7;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
  letter-spacing:.04em;text-align:center;padding:2px 0 3px;line-height:1;
  backdrop-filter:blur(2px)}
.thumb.lg .tpl{font-size:12px;padding:3px 0 4px}
.thumb.sm .tpl{font-size:9px}
.fotobox{display:flex;gap:12px;align-items:flex-start}
.fotobox .prev{width:84px;height:63px;flex:none;border-radius:9px;overflow:hidden;
  background:var(--sf2);border:1.5px dashed var(--ln2);display:grid;place-items:center;color:var(--tx3)}
.fotobox .prev img{width:100%;height:100%;object-fit:cover}
.fotobox .prev svg{width:26px;height:26px}

.i20{width:20px;height:20px;flex:none}
/* rede de segurança: nenhum ícone sem dimensão pode esticar e esmagar o texto.
   Gráficos usam style inline (width:100%), que tem prioridade. */
svg:not([class]){width:20px;height:20px;flex:none}
svg{max-width:100%}
.row>svg,.veic>svg{width:20px;height:20px;flex:none;color:var(--tx3)}
.insight .d{font-size:var(--t-sup);color:var(--tx2);line-height:1.55;margin-top:4px}
.insight .d b{color:var(--tx);font-weight:600}

.kb{display:flex;gap:11px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;
  max-width:100%;overscroll-behavior-x:contain}
.col{flex:none;width:270px;scroll-snap-align:start;background:var(--sf);border:1px solid var(--ln);
  border-radius:var(--r);display:flex;flex-direction:column}
.col-h{padding:12px 13px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:8px}
.col-h .dot{width:9px;height:9px;border-radius:50%;flex:none}
.col-h strong{font-size:var(--t-lab);font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex:1}
.col-h .n{font-size:var(--t-sup);font-weight:700;color:var(--tx2);font-family:'IBM Plex Mono',monospace}
.col-b{padding:9px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
.lead{background:var(--sf2);border:1px solid var(--ln);border-radius:11px;padding:12px;transition:.15s;cursor:grab}
.lead:hover{border-color:var(--ln2)}
.lead.dragging{opacity:.45;cursor:grabbing}
.col-b.dragover{outline:2px dashed var(--az);outline-offset:-4px;border-radius:11px;background:var(--az-10,rgba(47,107,232,.08))}
.lead .n{font-size:var(--t-txt);font-weight:600}
.lead .i{font-size:var(--t-sup);color:var(--tx2);margin-top:2px}
.lead .m{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.lead .v{font-family:'IBM Plex Mono',monospace;font-size:var(--t-sup);font-weight:600;color:var(--am)}

.gauge-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
.gauge{flex:none;position:relative}
.gauge .sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:8px}
.gauge .sc b{font-family:'IBM Plex Mono',monospace;font-size:var(--t-num);font-weight:600;line-height:1}
.gauge .sc small{font-size:var(--t-lab);text-transform:uppercase;color:var(--tx2);font-weight:700;margin-top:3px}

.empty{padding:36px 20px;text-align:center;color:var(--tx2)}
.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:10px}
.empty p{font-size:var(--t-sup)}
.empty strong{display:block;color:var(--tx);font-size:var(--t-tit);font-weight:600;margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);z-index:120;
  background:var(--tx);color:var(--bg);padding:13px 20px;border-radius:12px;font-size:var(--t-txt);
  font-weight:600;box-shadow:0 14px 40px -10px rgba(0,0,0,.6);opacity:0;
  transition:.3s cubic-bezier(.2,.8,.3,1);pointer-events:none;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}

.subtabs{display:flex;gap:4px;background:var(--sf);border:1px solid var(--ln);border-radius:11px;
  padding:4px;margin-bottom:14px}
.subtabs button{flex:1;min-height:42px;padding:9px 10px;border-radius:8px;font-size:var(--t-sup);
  font-weight:600;color:var(--tx2);transition:.14s}
.subtabs button.on{background:var(--sf2);color:var(--tx)}

.dre{width:100%;max-width:100%;border-collapse:collapse;table-layout:fixed}
.dre td{padding:11px 0;border-bottom:1px solid var(--ln);font-size:var(--t-txt);overflow-wrap:break-word}
.dre td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:500;width:40%}
.dre tr.tot td{font-weight:700;border-bottom:0;border-top:1.5px solid var(--ln2);padding-top:12px;font-size:var(--t-tit)}
.dre tr.sub td{color:var(--tx2);font-size:var(--t-sup);padding-left:14px}

.stat-line{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;
  border-bottom:1px solid var(--ln);font-size:var(--t-txt);gap:10px}
.stat-line:last-child{border-bottom:0}
.stat-line span{color:var(--tx2);min-width:0}
.stat-line b{font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:right;overflow-wrap:anywhere}

.veic{display:flex;gap:12px;padding:14px 15px;border-top:1px solid var(--ln);cursor:pointer;transition:.14s;min-height:var(--toque)}
.veic:first-child{border-top:0}
.veic:hover{background:var(--sf2)}
.veic .info{flex:1;min-width:0}
.veic .nm{font-size:var(--t-txt);font-weight:600;letter-spacing:-.01em}
.veic .dt{font-size:var(--t-sup);color:var(--tx2);margin-top:2px}
.veic .mt{display:flex;align-items:center;gap:7px;margin-top:9px;flex-wrap:wrap}
.veic .pr{text-align:right;flex:none}
.veic .pr .a{font-family:'IBM Plex Mono',monospace;font-size:var(--t-txt);font-weight:600}
.veic .pr .b{font-size:var(--t-sup);color:var(--tx2);margin-top:3px}

.stepper{display:flex;align-items:center;margin:4px 0 16px}
.stepper .sp{flex:1;text-align:center;position:relative;min-width:0}
.stepper .sp i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;margin:0 auto 7px;
  background:var(--sf2);border:1.5px solid var(--ln2);font-family:'IBM Plex Mono',monospace;
  font-size:var(--t-sup);font-weight:600;color:var(--tx2);font-style:normal;position:relative;z-index:2}
.stepper .sp.ok i{background:var(--vd-fb);border-color:var(--vd);color:var(--vd)}
.stepper .sp.now i{background:var(--az-sol);border-color:var(--az-sol);color:var(--sobre-az)}
.stepper .sp span{font-size:var(--t-lab);color:var(--tx2);display:block;line-height:1.25}
.stepper .sp.now span{color:var(--tx);font-weight:600}
.stepper .sp::before{content:'';position:absolute;top:15px;left:-50%;width:100%;height:1.5px;background:var(--ln);z-index:1}
.stepper .sp:first-child::before{display:none}
.stepper .sp.ok::before,.stepper .sp.now::before{background:var(--vd)}

.portal{display:flex;align-items:center;gap:12px;padding:13px 15px;border-top:1px solid var(--ln);min-height:var(--toque)}
.portal:first-child{border-top:0}
.portal .lg{width:42px;height:42px;border-radius:10px;flex:none;display:grid;place-items:center;
  font-weight:800;font-size:var(--t-lab);letter-spacing:-.03em;color:#fff}
.portal .grow{flex:1;min-width:0}
.portal .t{font-size:var(--t-txt);font-weight:600}
.portal .s{font-size:var(--t-sup);color:var(--tx2)}

.sw{width:52px;height:30px;border-radius:20px;background:var(--ln2);position:relative;flex:none;
  transition:.2s;cursor:pointer;border:0;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;transition:.2s}
.sw.on{background:var(--vd)}
.sw.on::after{transform:translateX(22px)}

.doc{background:#F6F8FA;color:#16191E;border-radius:8px;padding:20px 18px;font-family:'Archivo',sans-serif;
  box-shadow:0 6px 24px -12px rgba(0,0,0,.4)}
.doc .tb{display:flex;align-items:center;gap:11px;padding-bottom:13px;border-bottom:2px solid #16191E;margin-bottom:14px}
.doc .tb .mk{width:38px;height:38px;border-radius:9px;background:linear-gradient(150deg,#F2A93B,#C87A1C);
  color:#1A1206;display:grid;place-items:center;font-weight:800;font-size:14px}
.doc .tb b{font-size:var(--t-tit);font-weight:800;display:block;line-height:1.15}
.doc .tb small{font-size:var(--t-lab);color:#5A6570;font-weight:600}
.doc h4{font-size:var(--t-lab);font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin:15px 0 7px;color:#B45309}
.doc p{font-size:var(--t-sup);line-height:1.65;color:#333C46;margin-bottom:8px}
.doc .ln{display:flex;justify-content:space-between;font-size:var(--t-sup);padding:5px 0;border-bottom:1px dotted #CDD5DE}
.doc .ln b{font-family:'IBM Plex Mono',monospace;font-weight:600}
.doc .sig{margin-top:18px;padding-top:13px;border-top:1px dashed #98A3AE;display:flex;gap:14px}
.doc .sig div{flex:1;text-align:center}
.doc .sig .line{border-top:1.5px solid #16191E;margin-bottom:5px}
.doc .sig small{font-size:var(--t-lab);color:#5A6570}
.doc .assinado{background:#DAF0E6;border:1px solid #0F6045;border-radius:6px;padding:9px 11px;
  margin-top:12px;font-size:var(--t-lab);color:#0F6045;line-height:1.55;font-family:'IBM Plex Mono',monospace}

.perm{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--ln);min-height:var(--toque)}
.perm:first-child{border-top:0}
.perm .grow{flex:1;min-width:0;font-size:var(--t-txt)}
.perm .s{font-size:var(--t-sup);color:var(--tx2)}

.vit{border-radius:12px;overflow:hidden;border:1px solid var(--ln);background:var(--sf2)}
.vit .bar{height:34px;background:var(--bg);display:flex;align-items:center;gap:5px;padding:0 11px;border-radius:0;margin:0}
.vit .bar i{width:9px;height:9px;border-radius:50%;background:var(--ln2);display:block}
.vit .url{flex:1;background:var(--sf);border-radius:20px;font-size:var(--t-lab);color:var(--tx2);
  padding:4px 10px;margin-left:6px;font-family:'IBM Plex Mono',monospace;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.vit .hero{background:var(--bg);padding:18px 14px;text-align:center;display:block}
.vit .hero b{font-size:var(--t-tit);font-weight:800;display:block}
.vit .hero small{font-size:var(--t-sup);color:var(--tx2)}
.vit .cars{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.vit .cc{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px;min-width:0}
.vit .cc .ph{height:46px;border-radius:5px;background:var(--sf2);margin-bottom:7px;overflow:hidden;display:grid;place-items:center}
.vit .cc .ph img{width:100%;height:100%;object-fit:cover}
.vit .cc .ph svg{width:100%;height:100%;padding:3px 2px 0}
.vit .cc .n{font-size:var(--t-lab);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vit .cc .p{font-size:var(--t-sup);font-family:'IBM Plex Mono',monospace;color:var(--am);font-weight:600}

.aval-nota{text-align:center;padding:16px 0}
.aval-nota .n{font-family:'IBM Plex Mono',monospace;font-size:var(--t-hero);font-weight:600;letter-spacing:-.04em;line-height:1}
.aval-nota .l{font-size:var(--t-lab);letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);font-weight:700;margin-top:6px}

@media(min-width:960px){
  .sidebar{transform:none;position:relative;height:100vh;height:100dvh}
  .burger{display:none}
  .scrim{display:none}
  .view{padding:22px 26px}
  .topbar{padding:13px 26px}
  .tabs{padding:0 26px}
  .hero3{grid-template-columns:repeat(3,1fr)}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .g2{grid-template-columns:1.6fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g22{grid-template-columns:1fr 1fr}
  .modal{align-items:center}
  .modal-box{border-radius:18px;max-height:86dvh}
  .grab{display:none}
  @keyframes sheet{from{transform:scale(.97);opacity:0}}
  .col{max-height:560px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-mark">VC</div>
      <div style="min-width:0">
        <div class="sb-name">Vancar Veículos</div>
        <div class="sb-sub">Lauro de Freitas · BA</div>
      </div>
    </div>

    <nav class="sb-nav" id="sbNav"></nav>

    <div class="sb-ia">
      <button class="ia-btn" id="openIa">
        <span class="ia-dot"></span>
        <span style="flex:1;min-width:0">
          <strong id="iaNomeSb">Copiloto</strong>
          <small id="iaSub">tudo em ordem</small>
        </span>
      </button>
    </div>

    <div class="sb-foot">
      <div class="who" id="userIni">DA</div>
      <div class="qm">
        <b id="donoLabel">Proprietário</b>
        <span id="hojeLabel">—</span>
      </div>
      <button class="gear" id="btnCfg" aria-label="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <div class="main" id="main">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="tb-title"><h1 id="pgTitle">Hoje</h1></div>
      <div class="tb-act" id="pgAct"></div>
    </header>

    <div class="tabs" id="tabBar" style="display:none"></div>

    <main id="views">
      <section class="view on" id="v-hoje"></section>
      <section class="view" id="v-dash"></section>
      <section class="view" id="v-estoque"></section>
      <section class="view" id="v-renave"></section>
      <section class="view" id="v-anuncios"></section>
      <section class="view" id="v-vitrine"></section>
      <section class="view" id="v-crm"></section>
      <section class="view" id="v-avaliacao"></section>
      <section class="view" id="v-vendas"></section>
      <section class="view" id="v-fin"></section>
      <section class="view" id="v-carne"></section>
      <section class="view" id="v-contratos"></section>
      <section class="view" id="v-nfe"></section>
      <section class="view" id="v-dre"></section>
      <section class="view" id="v-despesas"></section>
      <section class="view" id="v-consig"></section>
      <section class="view" id="v-equipe"></section>
    </main>
  </div>
</div>

<div class="ia" id="iaSheet">
  <div class="ia-bg" data-close-ia></div>
  <div class="ia-panel">
    <div class="ia-h">
      <div class="ia-av">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 5.6L20 10l-5.6 2.4L12 18l-2.4-5.6L4 10l5.6-2.4L12 2z"/></svg>
      </div>
      <div class="grow" style="flex:1;min-width:0">
        <strong id="iaNome">Copiloto</strong>
        <small><span id="iaPapel">analista de risco e oportunidade</span></small>
      </div>
      <button class="x" id="iaVoz" aria-label="Ler as respostas em voz alta" title="Ler em voz alta" style="display:none;margin-right:2px">

<div class="modal" id="modal">
  <div class="modal-bg" data-close-modal></div>
  <div class="modal-box">

      <h3 id="mTitle">—</h3>
      <button class="x" data-close-modal aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-b" id="mBody"></div>
    <div class="modal-f" id="mFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const HOJE = new Date();
const dAgo = n => { const d = new Date(HOJE); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
const dFwd = n => { const d = new Date(HOJE); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const dMes = (i,total) => {
  const hd = HOJE.getDate();
  const dia = Math.max(1, Math.round(hd - (i*(hd-1))/Math.max(1,total-1)));
  return new Date(HOJE.getFullYear(), HOJE.getMonth(), dia).toISOString().slice(0,10);
};
const dias = iso => Math.round((HOJE - new Date(iso+'T12:00:00')) / 864e5);
const BRL = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(v||0);
const BRLc = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2}).format(v||0);
const NUM = v => new Intl.NumberFormat('pt-BR').format(Math.round(v||0));
const PCT = v => (v||0).toFixed(1).replace('.',',')+'%';
const dataBR = iso => new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
/* data com ano — para documentos (contrato, carnê): dd/mm/aaaa */
const dataBRano = iso => iso ? new Date(iso+'T12:00:00').toLocaleDateString('pt-BR') : '';
const mesNome = m => ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][m];
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s??'').replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
/* nome do veículo escapado (marca + modelo) para uso seguro em innerHTML */
const vNome = v => `${esc(v.marca)} ${esc(v.modelo)}`;
/* devolve o foco (e o cursor no fim) a um input após um re-render da tela — sem
   isso, a busca ao vivo perderia o foco a cada tecla digitada. */
const foco = id => { const n=document.getElementById(id); if(n){ n.focus(); if(n.setSelectionRange) try{ n.setSelectionRange(n.value.length,n.value.length); }catch(e){} } };
/* caixa de busca padrão das listas (mesmo visual de campo em pátio, clientes e
   despesas) — usa a classe .busca (borda e fundo iguais aos campos do sistema)
   com ícone de lupa para deixar claro que é um campo de busca. */
const buscaBox = (id, valor, ph, oninput) =>
  `<div class="busca">${svgi(ico.lupa)}<input id="${id}" value="${esc(valor)}" placeholder="${esc(ph)}" autocomplete="off" oninput="${oninput}"></div>`;
/* cores dos gráficos lidas do tema ativo */
const cv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888';

/* ==========================================================
   NAVEGAÇÃO — 5 grupos, abas por dentro
   Organizada pelo dia do lojista, não pela lista de recursos.
   ========================================================== */
const GRUPOS = [
  {k:'hoje', n:'Hoje', ico:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
   abas:[{k:'hoje', n:'Hoje'}]},

  {k:'patio', n:'Pátio', ico:'<path d="M5 17h14M3 17v-4l2-6h14l2 6v4"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
   abas:[{k:'estoque',n:'Estoque'},{k:'renave',n:'RENAVE'},{k:'anuncios',n:'Anúncios'},{k:'vitrine',n:'Site'}]},

  {k:'clientes', n:'Clientes', ico:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/>',
   abas:[{k:'crm',n:'Funil'},{k:'avaliacao',n:'Avaliar troca'}]},

  {k:'negocios', n:'Negócios', ico:'<path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
   abas:[{k:'vendas',n:'Vendas'},{k:'fin',n:'Financiar'},{k:'carne',n:'Carnê'},{k:'papelada',n:'Papelada'}]},

  {k:'dinheiro', n:'Dinheiro', ico:'<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
   abas:[{k:'dre',n:'Resultado'},{k:'despesas',n:'Despesas'},{k:'consig',n:'Consignação'}]}
];

/* onde cada tela antiga mora agora */
const ONDE = {};
GRUPOS.forEach(g=>g.abas.forEach(a=>ONDE[a.k]=g.k));
ONDE.nfe='negocios'; ONDE.contratos='negocios'; ONDE.equipe=null; ONDE.dash='dinheiro';

let grupoAtual='hoje', abaAtual='hoje', papeladaAba='contratos';

/* permissões passam a valer por grupo */
function grupoPermitido(g){
  const gr=GRUPOS.find(x=>x.k===g); if(!gr) return false;
  if(g==='hoje') return true;
  return gr.abas.some(a=>abaPermitida(a.k));
}
function abaPermitida(a){
  if(a==='papelada') return pode('contratos')||pode('nfe');
  return pode(a);
}

function montarMenu(){
  const nav=document.getElementById('sbNav');
  nav.innerHTML=GRUPOS.filter(g=>grupoPermitido(g.k)).map(g=>`
    <button class="navitem ${grupoAtual===g.k?'on':''}" data-grupo="${g.k}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${g.ico}</svg>
      ${g.n}<span class="sinal" data-sinal="${g.k}"></span>
    </button>`).join('');
  nav.querySelectorAll('.navitem').forEach(b=>b.onclick=()=>irGrupo(b.dataset.grupo));
}

function montarAbas(){
  const g=GRUPOS.find(x=>x.k===grupoAtual);
  const bar=document.getElementById('tabBar');
  const abas=g.abas.filter(a=>abaPermitida(a.k));
  if(abas.length<=1){ bar.style.display='none'; bar.innerHTML=''; return; }
  bar.style.display='';
  bar.innerHTML=abas.map(a=>{
    const n=contarAba(a.k);
    return `<button class="${abaAtual===a.k?'on':''}" data-aba="${a.k}">${a.n}${n?`<span class="b">${n}</span>`:''}</button>`;
  }).join('');
  bar.querySelectorAll('button').forEach(b=>b.onclick=()=>irAba(b.dataset.aba));
}

/* contagem só do que exige ação — não de tudo que existe */
function contarAba(k){
  if(k==='renave'){ const r=rnResumo(); return r.bloqueados.length+r.consigSem.length; }
  if(k==='crm') return DB.leads.filter(l=>!['fechado','perdido'].includes(l.etapa)&&l.proximo&&l.proximo<dFwd(0)).length;
  if(k==='papelada'){
    return DB.contratos.filter(c=>c.status==='aguardando').length
         + DB.notas.filter(n=>n.status==='rejeitada').length;
  }
  return 0;
}

function irGrupo(g){
  if(!grupoPermitido(g)){ toast('Você não tem acesso a esta área'); return; }
  grupoAtual=g;
  const gr=GRUPOS.find(x=>x.k===g);
  const abas=gr.abas.filter(a=>abaPermitida(a.k));
  abaAtual=abas[0]?.k||'hoje';
  document.getElementById('pgTitle').textContent=gr.n;
  document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('on',n.dataset.grupo===g));
  montarAbas(); mostrarAba(); fecharMenu();
  document.getElementById('main').scrollTop=0;
}
function irAba(a){
  abaAtual=a; montarAbas(); mostrarAba();
  document.getElementById('main').scrollTop=0;
}
function mostrarAba(){
  const alvo = abaAtual==='papelada' ? papeladaAba : abaAtual;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  const el=document.getElementById('v-'+(abaAtual==='papelada'?papeladaAba:abaAtual));
  if(el) el.classList.add('on');
  document.getElementById('pgAct').innerHTML=acoesTopo(alvo);
  render(alvo);
  if(abaAtual==='papelada') injetarSubPapelada();
  atualizarSinais();
}
function injetarSubPapelada(){
  const el=document.getElementById('v-'+papeladaAba);
  const nRej=DB.notas.filter(n=>n.status==='rejeitada').length;
  const nAg=DB.contratos.filter(c=>c.status==='aguardando').length;
  el.insertAdjacentHTML('afterbegin',`
    <div class="subtabs">
      <button class="${papeladaAba==='contratos'?'on':''}" onclick="papeladaAba='contratos';mostrarAba()">Contratos${nAg?` (${nAg})`:''}</button>
      <button class="${papeladaAba==='nfe'?'on':''}" onclick="papeladaAba='nfe';mostrarAba()">Nota fiscal${nRej?` (${nRej})`:''}</button>
    </div>`);
}

/* compatibilidade: chamadas antigas de go('estoque') continuam funcionando */
function go(tela){
  if(tela==='cfg'){ abrirConfig(); return; }
  if(tela==='equipe'){ if(!pode('equipe')){toast('Você não tem acesso a esta tela');return;} abrirEquipe(); return; }
  const g=ONDE[tela];
  if(!g){ toast('Tela indisponível'); return; }
  if(!pode(tela)){ toast('Você não tem acesso a esta tela'); return; }
  if(tela==='nfe'||tela==='contratos'){ papeladaAba=tela; grupoAtual='negocios'; abaAtual='papelada'; }
  else { grupoAtual=g; abaAtual=tela; }
  const gr=GRUPOS.find(x=>x.k===grupoAtual);
  document.getElementById('pgTitle').textContent=gr.n;
  document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('on',n.dataset.grupo===grupoAtual));
  montarAbas(); mostrarAba(); fecharMenu();
  document.getElementById('main').scrollTop=0;
}

/* ---- ORÇAMENTO DE ALERTA: um selo vermelho por vez ---- */
function atualizarSinais(){
  const contas={
    patio: contarAba('renave'),
    clientes: contarAba('crm'),
    negocios: contarAba('papelada'),
    dinheiro: 0, hoje: 0
  };
  const maior=Object.entries(contas).sort((a,b)=>b[1]-a[1])[0];
  document.querySelectorAll('[data-sinal]').forEach(s=>{
    const g=s.dataset.sinal, n=contas[g]||0;
    if(n>0 && g===maior[0] && maior[1]>0) s.outerHTML=`<span class="tag sinal" data-sinal="${g}">${n}</span>`;
    else if(n>0) s.outerHTML=`<span class="dot sinal" data-sinal="${g}"></span>`;
    else s.outerHTML=`<span class="sinal" data-sinal="${g}"></span>`;
  });
}

/* ==========================================================
   TELA "HOJE" — 3 números, no máximo 3 ações, 1 boa notícia
   ========================================================== */
function vHoje(){
  const m=M();
  const esperando=DB.leads.filter(l=>!['fechado','perdido'].includes(l.etapa)&&l.proximo&&l.proximo<=dFwd(0)).length;
  const h=HOJE.getHours();
  const saud = h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';

  const ins=analisar();
  /* orçamento: no máximo 1 vermelho + 2 âmbares */
  const riscos=ins.filter(i=>i.tipo==='risk').slice(0,1);
  const avisos=ins.filter(i=>i.tipo==='warn').slice(0,2);
  const acoes=[...riscos,...avisos].slice(0,3);
  const boa=ins.find(i=>i.tipo==='opp');

  const btn=(i)=>{
    const t=i.titulo.toLowerCase();
    if(t.includes('renave')||t.includes('integradora')) return `<button class="btn pri" onclick="go('renave')">Resolver no RENAVE</button>`;
    if(t.includes('nota fiscal')) return `<button class="btn pri" onclick="go('nfe')">Corrigir a nota</button>`;
    if(t.includes('contrato')) return `<button class="btn pri" onclick="go('contratos')">Ver contratos</button>`;
    if(t.includes('esperando')||t.includes('cliente')) return `<button class="btn pri" onclick="go('crm')">Ver quem ligar</button>`;
    if(t.includes('carnê')||t.includes('atraso')) return `<button class="btn pri" onclick="go('carne')">Ver carteira</button>`;
    if(t.includes('dias no pátio')||t.includes('capital')||t.includes('margem')) return `<button class="btn pri" onclick="go('estoque')">Ver no estoque</button>`;
    if(t.includes('portais')||t.includes('anúncio')) return `<button class="btn pri" onclick="go('anuncios')">Ver anúncios</button>`;
    return `<button class="btn pri" onclick="abrirIa()">Perguntar ao Copiloto</button>`;
  };
  const limpo = s => String(s).replace(/<\/?b>/g,'');

  return `
  <div style="margin-bottom:15px">
    <div style="font-size:var(--t-tit);font-weight:700;letter-spacing:-.02em">${saud}, ${DONO.split(' ')[0]}.</div>
    <div style="font-size:var(--t-sup);color:var(--tx2);margin-top:2px">
      ${HOJE.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div>
  </div>

  <div class="hero3">
    <div class="hero">
      <div class="ic" style="background:var(--vm-fb);color:var(--vm)">
        ${svgi('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')}</div>
      <div class="gr">
        <div class="v num" style="color:${m.capitalParado>0?'var(--vm)':'var(--tx)'}">${BRL(m.capitalParado)}</div>
        <div class="l">parados há mais de 60 dias</div>
      </div>
    </div>
    <div class="hero">
      <div class="ic" style="background:var(--vd-fb);color:var(--vd)">
        ${svgi('<path d="M3 17l6-6 4 4 8-8"/><path d="M21 7v5h-5"/>')}</div>
      <div class="gr">
        <div class="v num" style="color:${m.lucroLiqMes>=0?'var(--vd)':'var(--vm)'}">${BRL(m.lucroLiqMes)}</div>
        <div class="l">de lucro neste mês</div>
      </div>
    </div>
    <div class="hero">
      <div class="ic" style="background:var(--az-fb);color:var(--az)">
        ${svgi('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>')}</div>
      <div class="gr">
        <div class="v num">${esperando}</div>
        <div class="l">${esperando===1?'cliente esperando retorno':'clientes esperando retorno'}</div>
      </div>
    </div>
  </div>

  ${acoes.length?`
  <div class="sec">
    <div class="sec-h"><h2>${acoes.length===1?'1 coisa para hoje':acoes.length+' coisas para hoje'}</h2><div class="rule"></div></div>
    ${acoes.map(i=>`
      <div class="acao ${i.tipo==='risk'?'vm':'am'}">
        <div class="tp">${i.tipo==='risk'?'Resolver hoje':'Esta semana'}</div>
        <h4>${i.titulo}</h4>
        <p>${limpo(i.texto).split('.').slice(0,2).join('.')}.</p>
        ${btn(i)}
      </div>`).join('')}
  </div>`:`
  <div class="sec">
    <div class="card"><div class="empty">
      ${svgi('<path d="M20 6L9 17l-5-5"/>')}
      <strong>Nada pendente</strong><p>Nenhuma ação urgente para hoje.</p>
    </div></div>
  </div>`}

  ${boa?`
  <div class="sec">
    <div class="sec-h"><h2>Boa notícia</h2><div class="rule"></div></div>
    <div class="acao vd">
      <div class="tp">Oportunidade</div>
      <h4>${boa.titulo}</h4>
      <p>${limpo(boa.texto).split('.').slice(0,2).join('.')}.</p>
      <button class="btn" onclick="abrirIa()">Ver com o Copiloto</button>
    </div>
  </div>`:''}

  <div class="sec">
    <div class="sec-h"><h2>Atalhos</h2><div class="rule"></div></div>
    <div class="grid g3">
      ${[['Comprar carro','formVeiculo()','estoque'],
         ['Lançar venda','formVenda()','vendas'],
         ['Novo cliente','formLead()','crm']]
        .filter(([,,p])=>pode(p))
        .map(([n,f])=>`<button class="btn blk" onclick="${f}">${svgi('<path d="M12 5v14M5 12h14"/>')}${n}</button>`).join('')}
    </div>
  </div>`;
}

/* ==========================================================
   CONFIGURAÇÕES — tema, tamanho de texto, equipe
   ========================================================== */
function abrirConfig(){
  const tema=document.documentElement.dataset.tema;
  const txt=document.documentElement.dataset.texto;
  modal('Configurações',`
    <div class="field">
      <label>Tamanho do texto</label>
      <div class="subtabs" style="margin-bottom:0">
        ${[['normal','Normal'],['grande','Grande'],['maior','Maior']].map(([k,n])=>
          `<button class="${txt===k?'on':''}" onclick="setTexto('${k}')">${n}</button>`).join('')}
      </div>
      <div class="hint">Aumenta tudo de uma vez, sem quebrar o layout.</div>
    </div>
    <div class="field">
      <label>Aparência</label>
      <div class="subtabs" style="margin-bottom:0">
        ${[['claro','Claro'],['escuro','Escuro']].map(([k,n])=>
          `<button class="${tema===k?'on':''}" onclick="setTema('${k}')">${n}</button>`).join('')}
      </div>
      <div class="hint">O tema claro costuma ser mais confortável em pátio com sol.</div>
    </div>
    ${pode('equipe')?`
    <div class="field" style="margin-bottom:0">
      <label>Equipe e permissões</label>
      <button class="btn blk" onclick="fecharModal();abrirEquipe()">
        ${svgi('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>')}
        Gerenciar usuários (${DB.usuarios.length})</button>
    </div>`:''}
    ${USER.papelChave==='proprietario'?`
    <div class="field" style="margin-top:14px;margin-bottom:0">
      <label>Site da loja</label>
      <div style="display:flex;gap:16px;align-items:center;margin-bottom:10px">
        <div style="width:56px;height:56px;border-radius:11px;border:1px solid var(--linha);background:var(--asfalto) center/contain no-repeat${window.LOJA&&window.LOJA.logoUrl?`;background-image:url('${esc(window.LOJA.logoUrl)}')`:''};flex:none" title="logo"></div>
        <div style="flex:1;height:56px;border-radius:11px;border:1px solid var(--linha);background:var(--asfalto) center/cover no-repeat${window.LOJA&&window.LOJA.bannerUrl?`;background-image:url('${esc(window.LOJA.bannerUrl)}')`:''}" title="banner"></div>
      </div>
      <div class="f2">
        <button class="btn blk" onclick="subirMarcaUI('logo')">Trocar logo</button>
        <button class="btn blk" onclick="subirMarcaUI('banner')">Trocar banner</button>
      </div>
      <div class="hint">Logo: quadrada, mín. 200×200, PNG com fundo transparente. Banner: horizontal, ~1600×500, JPG.${window.LOJA&&window.LOJA.slug?` Seu site: <b>/${esc(window.LOJA.slug)}</b> — <a href="#" onclick="verMeuSite();return false" style="color:var(--placa)">abrir</a>`:''}</div>
    </div>`:''}
    ${USER.papelChave==='proprietario'?`
    <div class="field" style="margin-top:14px;margin-bottom:0">
      <label>Dados da empresa</label>
      <button class="btn blk" onclick="fecharModal();abrirDadosEmpresa()">
        ${svgi('<path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/>')}
        Razão social, CNPJ e endereço</button>
      <div class="hint">Entram no cabeçalho dos contratos (e da nota fiscal). A logo já é a de cima.</div>
    </div>
    <div class="field" style="margin-top:14px;margin-bottom:0">
      <label>Integrações (nota fiscal, RENAVE, portais)</label>
      <button class="btn blk" onclick="fecharModal();abrirIntegracoes()">
        ${svgi('<path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="4"/>')}
        Central de integrações</button>
      <div class="hint">Reúne o que a gente precisa para ligar NF-e, RENAVE e os portais. Você preenche; o ZelAuto finaliza a parte técnica com você.</div>
    </div>

let salvandoIntegra=false;
async function salvarIntegracoesUI(){
  if(salvandoIntegra) return;
  const btn=document.getElementById('igSalvar');
  salvandoIntegra=true; if(btn){ btn.disabled=true; btn.textContent='Salvando…'; }
  const cnpj=val('igCnpj').trim(), ie=val('igIe').trim();
  const cert=val('igCert'), integradora=val('igInt');
  const wmId=val('igWm').trim(), olxConta=val('igOlx').trim(), lim=numVal('igLim');
  // status derivado do que foi preenchido (só informativo para o operador)
  const nfeStatus = cert==='entregue' ? 'operador' : (cnpj? 'pendente' : 'pendente');
  const rnStatus  = integradora ? 'operador' : 'pendente';
  const poStatus  = (wmId||olxConta) ? 'operador' : 'pendente';
  try{
    await Dados.salvarConfigFiscal({ cnpj, ie, regime:val('igRegime'), ambiente:val('igAmb') });
    await Dados.salvarIntegracoes({
      nfe_status:nfeStatus, cert_status:cert,
      renave:{ integradora, status:rnStatus },
      portais:{ webmotors:{ id:wmId }, olx:{ conta:olxConta }, limite:lim||null, status:poStatus },
    });
  }catch(e){
    toast('Erro ao salvar: '+(e.message||e));
    salvandoIntegra=false; if(btn){ btn.disabled=false; btn.textContent='Salvar'; } return;
  }
  if(window.LOJA){ window.LOJA.integracoes={ ...(window.LOJA.integracoes||{}),
    nfe_status:nfeStatus, cert_status:cert,
    renave:{ integradora, status:rnStatus },
    portais:{ webmotors:{ id:wmId }, olx:{ conta:olxConta }, limite:lim||null, status:poStatus } };
    window.LOJA.cnpj=cnpj; }
  salvandoIntegra=false;
  fecharModal(); toast('Integrações salvas — o ZelAuto finaliza o resto com você');
}

  const d=r.depois||r.antes||{};
  return esc(d.modelo? (d.marca?d.marca+' ':'')+d.modelo+(d.placa?' · '+d.placa:'')

let _supTimer=null;
async function verificarSuporteAtivo(){
  if(!USER || USER.papelChave!=='proprietario'){ const b=document.getElementById('supBar'); if(b) b.remove(); return; }
  let sess=[]; try{ sess=await Dados.listarSuporteSessoes(); }catch(_){ return; }
  const ativa=sess.find(s=>s.ativa);
  let bar=document.getElementById('supBar');
  if(ativa){
    if(!bar){ bar=_supEl('<div id="supBar"></div>'); document.body.appendChild(bar); }
    bar.style.cssText='position:fixed;left:0;right:0;top:0;z-index:70;background:var(--am);color:#17130A;font-weight:700;font-size:var(--t-sup);padding:9px 14px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap';

  } else if(bar){ bar.remove(); }
}
function iniciarMonitorSuporte(){

/* ---- Tela 1: perguntas frequentes ---- */
function supVerFaq(){
  clearInterval(_supChatTimer); _supChatTimer=null;
  const c=document.getElementById('supCorpo'), f=document.getElementById('supRodape');
  if(!c||!f) return;
  document.getElementById('supTit').textContent='Suporte ZelAuto';
  document.getElementById('supSub').textContent='Tire a dúvida na hora — ou fale com a gente';
  document.getElementById('supVoltar').style.display='none';
  c.innerHTML=`<div class="qtit">Perguntas rápidas</div>
    ${SUP_FAQ.map(([q,a])=>`<div class="supq"><button onclick="this.parentNode.classList.toggle('on')"><span>${q}</span><span style="color:var(--az)">+</span></button><div class="a">${a}</div></div>`).join('')}`;
  f.innerHTML=`<button class="btn pri blk" onclick="supVerChat()">Não resolveu? Falar com o suporte</button>
    <div style="text-align:center;margin-top:9px"><button class="lnk" onclick="suporteToggle(false);suporteUI()">Ver acessos de suporte ao meu painel</button></div>`;
}

/* ---- Tela 2: conversa ---- */
async function supVerChat(){
  const c=document.getElementById('supCorpo'), f=document.getElementById('supRodape');
  if(!c||!f) return;
  document.getElementById('supTit').textContent='Conversa com o suporte';
  document.getElementById('supSub').textContent='Respondemos em horário comercial';
  document.getElementById('supVoltar').style.display='';
  c.innerHTML='<div class="hint">Carregando…</div>';
  f.innerHTML=`<textarea id="supTxt" rows="1" placeholder="Escreva sua mensagem…"></textarea>
    <button class="btn pri blk" style="margin-top:8px" id="supSend" onclick="supEnviar()">Enviar</button>
    <div id="supAut" style="margin-top:9px"></div>`;
  await supCarregarChat();
  clearInterval(_supChatTimer);
  _supChatTimer=setInterval(()=>{ if(document.getElementById('supPanel')?.classList.contains('on')) supCarregarChat(); }, 12000);
}

async function supCarregarChat(){
  const c=document.getElementById('supCorpo'); if(!c) return;
  try{ _supChamado = await Dados.chamadoAbertoSuporte(); }
  catch(e){ c.innerHTML='<div class="hint">Não consegui carregar: '+esc(e.message||e)+'</div>'; return; }

  if(!_supChamado){
    c.innerHTML=`<div class="hint" style="line-height:1.6">Conte o que está acontecendo. A gente responde por aqui mesmo — e você continua vendo tudo no seu painel.</div>`;
    supRenderAutorizar(); return;
  }
  let msgs=[]; try{ msgs=await Dados.listarMensagensSuporte(_supChamado.id); }catch(_){}
  const perto = c.scrollHeight - c.scrollTop - c.clientHeight < 60;
  c.innerHTML = msgs.map(m=>`<div class="supm ${m.autor==='lojista'?'eu':'eles'}">${esc(m.texto)}<span class="q">${esc(m.nome)} · ${_supHora(m.criadoEm)}</span></div>`).join('')
    || '<div class="hint">Sem mensagens ainda.</div>';
  if(perto) c.scrollTop=c.scrollHeight;
  try{ await Dados.marcarSuporteLido(_supChamado.id); }catch(_){}
  supAtualizarBadge();
  supRenderAutorizar();
}

/* O pedido de entrar no painel é o ÚLTIMO recurso — e só o dono decide. */
function supRenderAutorizar(){
  const box=document.getElementById('supAut'); if(!box) return;
  if(!_supChamado || USER.papelChave!=='proprietario'){ box.innerHTML=''; return; }
  box.innerHTML = _supChamado.autorizaAcesso
    ? `<div class="hint" style="color:var(--am)">Você autorizou o suporte a acessar seu painel neste chamado. Dá para cortar quando quiser em <button class="lnk" onclick="suporteToggle(false);suporteUI()">acessos de suporte</button>.</div>`
    : `<button class="lnk" onclick="supAutorizar()">Ainda não resolveu? Autorizar o suporte a entrar no meu painel →</button>`;
}
async function supAutorizar(){
  if(!_supChamado) return;
  if(!confirm('Autorizar o suporte da ZelAuto a acessar o seu painel para resolver este chamado?\n\nO acesso tem prazo, fica registrado, e você encerra quando quiser.')) return;
  try{
    await Dados.autorizarAcessoSuporte(_supChamado.id);
    toast('Acesso autorizado. Vamos entrar e resolver.');
    await supCarregarChat();
  }catch(e){ toast('Não consegui autorizar: '+(e.message||e)); }
}

async function supEnviar(){
  if(_supEnviando) return;
  const ta=document.getElementById('supTxt'); const txt=(ta?.value||'').trim();
  if(!txt){ toast('Escreva a mensagem primeiro.'); return; }
  const b=document.getElementById('supSend');
  _supEnviando=true; if(b){ b.disabled=true; b.textContent='Enviando…'; }
  try{
    if(_supChamado) await Dados.enviarMensagemSuporte(_supChamado.id, txt);
    else            await Dados.abrirChamadoSuporte(txt, false);
    if(ta) ta.value='';
    await supCarregarChat();
    const c=document.getElementById('supCorpo'); if(c) c.scrollTop=c.scrollHeight;
  }catch(e){ toast('Não consegui enviar: '+(e.message||e)); }
  _supEnviando=false; if(b){ b.disabled=false; b.textContent='Enviar'; }
}

function suporteToggle(force){
  const p=document.getElementById('supPanel'); if(!p) return;
  const abrir = force===undefined ? !p.classList.contains('on') : !!force;
  p.classList.toggle('on', abrir);
  if(!abrir){ clearInterval(_supChatTimer); _supChatTimer=null; supAtualizarBadge(); }
}

  if(document.getElementById('suspOv')) return;

/* ---- Assinatura da loja (AbacatePay): PIX copia-e-cola/QR ou cartão ---- */
const PLANO_ROTULO={ trial:['ok','em avaliação'], ativa:['ok','ativa'], vencida:['warn','vencida'], suspensa:['bad','suspensa'], cancelada:['mute','cancelada'] };
function fmtVenc(iso){ return iso? new Date(iso+'T12:00:00').toLocaleDateString('pt-BR') : '—'; }
async function abrirPlano(){
  let a=null; try{ a=await Dados.carregarAssinatura(); }catch(_){ a=null; }
  const st=(a&&a.status)||'trial';
  const [cls,txt]=PLANO_ROTULO[st]||PLANO_ROTULO.trial;
  const valor=a&&a.valorCentavos? BRL(a.valorCentavos/100):'';
  modal('Assinatura da loja',`
    <div class="stat-line"><span>Situação</span><b><span class="pill ${cls}">${txt}</span></b></div>
    <div class="stat-line"><span>Vence em</span><b>${fmtVenc(a&&a.venceEm)}</b></div>
    ${valor?`<div class="stat-line"><span>Mensalidade</span><b>${valor}</b></div>`:''}
    <div class="hint" style="margin:8px 0 14px">O pagamento libera automaticamente — não precisa avisar ninguém. Depois de vencido, o acesso segue por 3 dias antes de suspender.</div>
    <div id="plnArea"></div>
    <div class="f2" style="margin-top:12px">
      <button class="btn pri" id="plnPix" onclick="planoPix()">Pagar com PIX</button>
      <button class="btn blk" id="plnCard" onclick="planoCartao()">Pagar com cartão</button>
    </div>`,
    `<button class="btn" data-close-modal>Fechar</button>
     <button class="btn" onclick="planoAtualizar()">Já paguei / atualizar</button>`);
}
let gerandoPix=false;
async function planoPix(){
  if(gerandoPix) return;
  const area=document.getElementById('plnArea'); const btn=document.getElementById('plnPix');
  gerandoPix=true; if(btn){ btn.disabled=true; btn.textContent='Gerando…'; }
  let r;
  try{ r=await Dados.gerarPixAssinatura(); }
  catch(e){ toast('Não consegui gerar o PIX: '+(e.message||e)); gerandoPix=false; if(btn){ btn.disabled=false; btn.textContent='Pagar com PIX'; } return; }
  gerandoPix=false; if(btn){ btn.disabled=false; btn.textContent='Gerar outro PIX'; }
  if(!area) return;
  area.innerHTML=`
    <div style="text-align:center;padding:8px 0">
      ${r.brCodeBase64?`<img src="${r.brCodeBase64.startsWith('data:')?esc(r.brCodeBase64):'data:image/png;base64,'+esc(r.brCodeBase64)}" alt="QR Code PIX" style="width:190px;height:190px;border-radius:12px;background:#fff;padding:8px">`:''}
      <div style="font-size:var(--t-lab);color:var(--placa-3);margin-top:8px">Escaneie no app do banco ou copie o código:</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="plnBr" readonly value="${esc(r.brCode||'')}" style="flex:1;font-family:ui-monospace,monospace;font-size:11px">
        <button class="btn" onclick="planoCopiar()">Copiar</button>
      </div>
      <div class="hint" style="margin-top:8px">Assim que o PIX cair, a assinatura é liberada sozinha. Toque em “Já paguei / atualizar” para conferir.</div>
    </div>`;
}
function planoCopiar(){
  const i=document.getElementById('plnBr'); if(!i) return;
  i.select(); try{ navigator.clipboard.writeText(i.value); }catch(_){ document.execCommand('copy'); }
  toast('Código PIX copiado');
}
async function planoCartao(){
  const btn=document.getElementById('plnCard'); if(btn){ btn.disabled=true; btn.textContent='Abrindo…'; }
  try{ const r=await Dados.checkoutCartaoAssinatura(); if(r&&r.url) window.open(r.url,'_blank','noopener'); else toast('Não consegui abrir o checkout'); }
  catch(e){ toast('Não consegui abrir o cartão: '+(e.message||e)); }
  if(btn){ btn.disabled=false; btn.textContent='Pagar com cartão'; }
}
async function planoAtualizar(){
  try{
    const s=await Dados.statusAssinatura();
    if(s&&s.pago){ toast('Pagamento confirmado — assinatura ativa'); liberarSuspensa(); }
    else toast('Ainda não caiu. Se acabou de pagar, aguarde alguns segundos.');
    fecharModal();
    // se ainda está suspensa (não pago), reabre o plano; se liberou, volta ao app
    if(!(await Dados.lojaAtiva())) abrirPlano();
  }
  catch(e){ toast('Não consegui atualizar: '+(e.message||e)); }
}
function verMeuSite(){
  if(!window.LOJA||!window.LOJA.slug) return;
  const base=((window.ZELAUTO_CONFIG&&window.ZELAUTO_CONFIG.url)||'').replace('.supabase.co','.functions.supabase.co');
  if(base) window.open(`${base}/site-loja?slug=${encodeURIComponent(window.LOJA.slug)}`,'_blank','noopener');
  else toast('Configure a URL do Supabase para abrir o site.');
}

   ========================================================== */
const custoTotal = v => v.compra + v.prep;
const margemPrev = v => v.alvo - custoTotal(v);
const margemPct  = v => (margemPrev(v) / custoTotal(v)) * 100;
const patio      = () => DB.veiculos.filter(v=>v.status==='estoque');

function M(){
  const est = patio();
  const capital = est.reduce((s,v)=>s+custoTotal(v),0);
  const vitrine = est.reduce((s,v)=>s+v.alvo,0);
  const margemEmbutida = vitrine - capital;

  const ini = new Date(HOJE.getFullYear(), HOJE.getMonth(), 1).toISOString().slice(0,10);
  const doMes = DB.vendas.filter(s=>s.data>=ini);
  const lucroBrutoMes = doMes.reduce((s,x)=>s+(x.valor-x.custo)+x.retornoBanco-x.comissao,0);
  const faturaMes = doMes.reduce((s,x)=>s+x.valor,0);

  const fixas = DB.despesas.filter(d=>d.tipo==='fixa').reduce((s,d)=>s+d.valor,0);
  const variaveis = DB.despesas.filter(d=>d.tipo==='variavel').reduce((s,d)=>s+d.valor,0);
  const despesaMes = fixas + variaveis;
  const lucroLiqMes = lucroBrutoMes - despesaMes;

  const giro = DB.vendas.reduce((s,x)=>s+x.diasPatio,0) / DB.vendas.length;
  const margemMedia = DB.vendas.reduce((s,x)=>s+((x.valor-x.custo)/x.custo*100),0) / DB.vendas.length;
  const ticket = DB.vendas.reduce((s,x)=>s+x.valor,0) / DB.vendas.length;

  const parados = est.filter(v=>dias(v.entrada)>60);
  const capitalParado = parados.reduce((s,v)=>s+custoTotal(v),0);

  const aReceber = DB.carne.reduce((s,k)=>{
    const p = pmt(k.financiado, k.taxa, k.parcelas);
    return s + p*(k.parcelas-k.pagas);
  },0);
  const inadimplente = DB.carne.filter(k=>k.atraso>0);

  const vitrineConsig = DB.consignados.reduce((s,c)=>s+c.anuncio,0);
  const potencialConsig = DB.consignados.reduce((s,c)=>s+c.anuncio*c.comissao/100,0);

  const pontoEquilibrio = despesaMes / (margemMedia/100 * ticket) ;

  return {est,capital,vitrine,margemEmbutida,doMes,lucroBrutoMes,faturaMes,fixas,variaveis,
    despesaMes,lucroLiqMes,giro,margemMedia,ticket,parados,capitalParado,aReceber,
    inadimplente,vitrineConsig,potencialConsig,pontoEquilibrio};
}

/* Tabela Price */
function pmt(pv, taxaPct, n){
  const i = taxaPct/100;
  if(i===0) return pv/n;
  return pv * i / (1 - Math.pow(1+i, -n));
}

/* vendas agrupadas por mês, últimos 6 */
function serieMeses(){
  const out=[];
  for(let k=5;k>=0;k--){
    const d=new Date(HOJE.getFullYear(),HOJE.getMonth()-k,1);
    const ini=d.toISOString().slice(0,7);
    const vs=DB.vendas.filter(s=>s.data.slice(0,7)===ini);
    out.push({
      rot: mesNome(d.getMonth()),
      qtd: vs.length,
      fat: vs.reduce((s,x)=>s+x.valor,0),
      luc: vs.reduce((s,x)=>s+(x.valor-x.custo)+x.retornoBanco-x.comissao,0)
    });
  }
  return out;
}

function tipoCarroceria(v){

/* leitura de arquivo → data URL, guardado na memória da sessão */
function lerFoto(input, aoTerminar){
  const f = input.files && input.files[0];
  if(!f) return;
  if(!f.type.startsWith('image/')){ toast('Escolha um arquivo de imagem'); return; }
  const r = new FileReader();
  r.onload = e => redimensionar(e.target.result, 640, aoTerminar);
  r.onerror = () => toast('Não consegui ler a imagem');
  r.readAsDataURL(f);
}
/* reduz para não pesar a sessão */
function redimensionar(dataUrl, maxW, cb){
  const img = new Image();
  img.onload = () => {
    const esc = Math.min(1, maxW / img.width);
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*esc); c.height = Math.round(img.height*esc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    try { cb(c.toDataURL('image/jpeg', 0.78)); }
    catch(e){ cb(dataUrl); }
  };
  img.onerror = () => cb(dataUrl);
  img.src = dataUrl;
}

/* ---- gráfico de área (fluxo) ---- */
function areaChart(pts, w=520, h=140){
  const max = Math.max(...pts.map(p=>p.v)) * 1.18 || 1;
  const min = 0;
  const px = i => (i/(pts.length-1))*(w-8)+4;
  const py = v => h-24 - ((v-min)/(max-min))*(h-38);
  let d='', a='';
  pts.forEach((p,i)=>{ const x=px(i), y=py(p.v); d += (i?'L':'M')+x+','+y+' '; });
  a = d + `L${px(pts.length-1)},${h-24} L${px(0)},${h-24} Z`;
  const dots = pts.map((p,i)=>`<circle cx="${px(i)}" cy="${py(p.v)}" r="${i===pts.length-1?4:2.5}" fill="${i===pts.length-1?cv('--am'):cv('--az-sol')}" stroke="${cv('--sf')}" stroke-width="2"/>`).join('');
  const labs = pts.map((p,i)=>`<text x="${px(i)}" y="${h-6}" text-anchor="middle" font-size="12" fill="${cv('--tx2')}" font-family="IBM Plex Mono">${p.r}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${cv('--az-sol')}" stop-opacity=".34"/><stop offset="100%" stop-color="${cv('--az-sol')}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${a}" fill="url(#ga)"/>
    <path d="${d}" fill="none" stroke="${cv('--az-sol')}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labs}
  </svg>`;
}

/* ---- barras ---- */
function barChart(items, w=520, h=150){
  const max = Math.max(...items.map(i=>i.v)) || 1;
  const bw = (w-10)/items.length;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    ${items.map((it,i)=>{
      const bh = Math.max(3,(it.v/max)*(h-42));
      const x = 5+i*bw+bw*0.18, y = h-26-bh, ww = bw*0.64;
      return `<rect x="${x}" y="${y}" width="${ww}" height="${bh}" rx="4" fill="${it.c||'#F79A1B'}" opacity="${it.dim?.4:.92}"/>
      <text x="${x+ww/2}" y="${y-6}" text-anchor="middle" font-size="11.5" fill="${cv('--tx2')}" font-family="IBM Plex Mono">${it.l2||''}</text>
      <text x="${x+ww/2}" y="${h-8}" text-anchor="middle" font-size="12" fill="${cv('--tx2')}" font-family="IBM Plex Mono">${it.l}</text>`;
    }).join('')}
  </svg>`;
}

/* ---- rosca ---- */
function donut(items, size=132){
  const tot = items.reduce((s,i)=>s+i.v,0)||1;
  const R=size/2, r=R-13, C=2*Math.PI*r;
  let off=0;
  const arcs = items.map(it=>{
    const len = it.v/tot*C;
    const s = `<circle cx="${R}" cy="${R}" r="${r}" fill="none" stroke="${it.c}" stroke-width="15"
      stroke-dasharray="${len-2.5} ${C-len+2.5}" stroke-dashoffset="${-off}" transform="rotate(-90 ${R} ${R})" stroke-linecap="butt"/>`;
    off+=len; return s;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex:none">${arcs}
    <text x="${R}" y="${R-2}" text-anchor="middle" font-size="24" font-weight="600" fill="${cv('--tx')}" font-family="IBM Plex Mono">${tot}</text>
    <text x="${R}" y="${R+13}" text-anchor="middle" font-size="11" fill="${cv('--tx2')}" font-family="Archivo" letter-spacing="1">LEADS</text></svg>`;
}

/* ---- ponteiro de saúde (o "conta-giros" da loja) ---- */
function gauge(score, size=132){
  const R=size/2, r=R-11, C=Math.PI*r; // meia volta
  const frac = Math.max(0,Math.min(100,score))/100;
  const cor = score>=70?'#31A97C':score>=45?'#F2A93B':'#E0574B';
  return `<div class="gauge" style="width:${size}px;height:${size*0.78}px">
    <svg viewBox="0 0 ${size} ${size*0.78}" style="width:100%;height:100%">
      <path d="M ${R-r} ${R} A ${r} ${r} 0 0 1 ${R+r} ${R}" fill="none" stroke="${cv('--ln')}" stroke-width="11" stroke-linecap="round"/>
      <path d="M ${R-r} ${R} A ${r} ${r} 0 0 1 ${R+r} ${R}" fill="none" stroke="${cor}" stroke-width="11" stroke-linecap="round"
        stroke-dasharray="${C*frac} ${C}"/>
    </svg>
    <div class="sc"><b style="color:${cor}">${score}</b><small>saúde</small></div>
  </div>`;
}

let salvandoVeic=false;
async function salvarEdicaoVeiculo(id){
  if(salvandoVeic) return;
  const v=DB.veiculos.find(x=>x.id===id); if(!v) return;
  const campos={ km:numVal('edKm'), cor:val('edCor'), alvo:numVal('edAlvo'), status:val('edStatus') };
  if(USER.verCustos){ campos.compra=numVal('edCompra'); campos.prep=numVal('edPrep'); }
  const btn=document.getElementById('edSalvar');
  salvandoVeic=true; if(btn){ btn.disabled=true; btn.textContent='Salvando…'; }
  try{
    await Dados.atualizarVeiculo(id, campos);
  }catch(e){
    toast('Erro ao salvar: '+(e.message||e));
    if(btn){ btn.disabled=false; btn.textContent='Salvar alterações'; }
    salvandoVeic=false; return;
  }
  // reflete em memória só depois de persistir
  v.km=campos.km; v.cor=campos.cor; v.alvo=campos.alvo; v.status=campos.status;
  if(USER.verCustos){ v.compra=campos.compra; v.prep=campos.prep; }
  salvandoVeic=false;
  fecharModal(); render('estoque'); atualizarTags(); toast('Veículo atualizado');
}

function trocarFoto(id){
  const ehVeiculo=DB.veiculos.some(x=>x.id===id);
  const v=DB.veiculos.find(x=>x.id===id)||DB.consignados.find(x=>x.id===id);
  if(!v) return;
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.setAttribute('capture','environment');
  inp.onchange=()=>lerFoto(inp, async u=>{
    v.foto=u; fecharModal(); mostrarAba();       // preview imediato
    // Só veículos persistem foto (Storage). Consignados seguem em memória por ora.
    if(!ehVeiculo){ toast('Foto atualizada'); return; }
    try{
      const url=await Dados.subirFotoVeiculo(id, u);
      if(url){ v.foto=url; mostrarAba(); }
      toast('Foto salva');
    }catch(e){ toast('Não consegui salvar a foto: '+(e.message||e)); }
  });
  inp.click();
}

          <div style="flex:1;font-size:var(--t-sup);color:var(--placa-2);line-height:1.5">

  modal(l.nome,`
    <div class="stat-line"><span>Telefone</span><b style="font-family:'IBM Plex Mono'">${esc(l.tel||'—')}</b></div>
    <div class="stat-line"><span>Interesse</span><b>${esc(l.interesse||'A definir')}</b></div>

    <div class="stat-line"><span>Origem</span><b>${esc(l.origem)}</b></div>
    ${l.troca?`<div class="stat-line"><span>Tem para troca</span><b>${esc(l.troca)}</b></div>`:''}

    ${l.obs?`<div style="margin:14px 0 4px;padding:12px;border-radius:11px;background:var(--asfalto);border:1px solid var(--linha);font-size:var(--t-sup);color:var(--placa-2);line-height:1.5">${esc(l.obs)}</div>`:''}
