    <div class="field" style="margin-top:14px"><label>Mover para</label><select id="leadEtapa">${opts}</select></div>
    <div class="field"><label>Próximo contato</label><input type="date" id="leadProx" value="${l.proximo||''}"></div>
    <div class="field"><label>Registrar contato</label><textarea id="leadObs" rows="2" placeholder="O que ficou combinado? (entra no histórico)"></textarea></div>`,
    `${USER.papelChave==='proprietario'?`<button class="btn danger" onclick="excluirLead('${l.id}')">Excluir</button>`:''}
     <a class="btn" href="https://wa.me/55${l.tel.replace(/\D/g,'')}" target="_blank" rel="noopener">WhatsApp</a>
     <button class="btn pri" onclick="salvarLead('${l.id}')">Salvar</button>`);
}
async function salvarLead(id){
  const l=DB.leads.find(x=>x.id===id); if(!l) return;
  const novaEtapa=val('leadEtapa'), prox=val('leadProx'), nota=val('leadObs').trim();
  const etapaMudou = novaEtapa!==l.etapa;
  // monta a versão atualizada e só reflete em memória DEPOIS de persistir
  const atualizado={ ...l, etapa:novaEtapa, proximo:prox, ultimo:dFwd(0) };
  try{
    await Dados.salvarCliente(atualizado);
    // histórico: mudança de etapa e/ou a nota digitada (falha aqui não derruba o salvar)
    if(etapaMudou){ const e=ETAPAS.find(x=>x.k===novaEtapa);
      try{ await Dados.registrarInteracao(id,{tipo:'etapa',texto:'Movido para '+((e&&e.n)||novaEtapa)}); }catch(_){} }
    if(nota){ try{ await Dados.registrarInteracao(id,{tipo:'nota',texto:nota}); }catch(_){} }
  }catch(e){ toast('Erro ao atualizar cliente: '+(e.message||e)); return; }
  Object.assign(l, atualizado);
  fecharModal(); render('crm'); atualizarTags();
  toast(novaEtapa==='fechado'?'Negócio marcado como fechado':'Cliente atualizado');
}

/* Arrastar o cartão do lead entre as colunas do funil (estilo Trello). No
   desktop é o gesto natural; no toque, o fluxo de tocar no lead → "Mover para"
   segue valendo. */
let _dragLead=null;
function leadDrag(ev,id){
  _dragLead=id;
  ev.dataTransfer.effectAllowed='move';
  try{ ev.dataTransfer.setData('text/plain',id); }catch(_){}
  const c=ev.currentTarget; if(c) setTimeout(()=>c.classList.add('dragging'),0);
}
function leadFim(ev){ const c=ev.currentTarget; if(c) c.classList.remove('dragging'); _dragLead=null; }
async function leadSolta(ev,etapa){
  ev.preventDefault();
  const id=_dragLead||(ev.dataTransfer&&ev.dataTransfer.getData('text/plain')); _dragLead=null;
  const l=DB.leads.find(x=>x.id===id); if(!l||l.etapa===etapa) return;
  const anterior=l.etapa, ultimoAnt=l.ultimo;
  l.etapa=etapa; l.ultimo=dFwd(0);                 // otimista: move na hora
  render('crm');
  try{ await Dados.salvarCliente({ ...l }); }
  catch(e){ l.etapa=anterior; l.ultimo=ultimoAnt; render('crm'); toast('Não consegui mover: '+(e.message||e)); return; }
  atualizarTags();
  toast(`Movido para ${(ETAPAS.find(x=>x.k===etapa)||{}).n||etapa}`);
}

/* Excluir lead — para duplicados. Só proprietário/gerente (a política de delete
   do banco também limita a esses papéis; gate aqui evita erro para o vendedor). */
async function excluirLead(id){
  const l=DB.leads.find(x=>x.id===id); if(!l) return;
  if(!confirm(`Excluir "${l.nome}" do funil? Esta ação não pode ser desfeita.`)) return;
  try{ await Dados.removerCliente(id); }
  catch(e){ toast('Não consegui excluir: '+(e.message||e)); return; }
  DB.leads=DB.leads.filter(x=>x.id!==id);
  fecharModal(); render('crm'); atualizarTags(); toast('Cliente excluído');
}

/* YYYY-MM em horário LOCAL (não usar toISOString: converteria para UTC e, perto
   da virada do mês em BRT, cairia no mês errado). Bate com v.data ('YYYY-MM-DD'). */
const mesYM = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
/* mês selecionado no relatório (YYYY-MM); default = mês corrente */
let DRE_MES = mesYM(HOJE);
/* últimos 12 meses como opções do seletor */
function dreMeses(){
  const out=[];
  for(let k=0;k<12;k++){
    const d=new Date(HOJE.getFullYear(), HOJE.getMonth()-k, 1);
    out.push({ v:mesYM(d), n:d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}) });
  }
  return out;
}
function dreTrocaMes(v){ DRE_MES=v; render('dre'); }

  return `

        <tr class="tot"><td>Lucro bruto</td><td style="color:#5FD3A6">${BRL(bruto)}</td></tr>

        <tr><td>Comissão dos vendedores</td><td style="color:#F58177">− ${BRL(com)}</td></tr>

let CAR_ATUAL=null;

/* Fecha o contrato: pede nome/telefone do comprador e persiste contrato +
   parcelas. Só quem pode ver custo fecha carnê (é decisão comercial/financeira). */
function carFechar(){
  if(!CAR_ATUAL || !CAR_ATUAL.valor){ toast('Simule um valor antes de fechar'); return; }
  const s=CAR_ATUAL;
  modal('Fechar contrato no carnê',`
    <div style="padding:12px;border-radius:11px;background:var(--asfalto);border:1px solid var(--linha);margin-bottom:14px;font-size:var(--t-sup);color:var(--placa-2)">
      ${s.veiculo?esc(s.veiculo)+' · ':''}${BRL(s.valor)} · entrada ${BRL(s.entrada)} ·
      <b class="num">${s.prazo}x de ${BRLc(s.valorParcela)}</b>
    </div>
    <div class="field"><label>Nome do comprador</label><input id="cfNome" placeholder="Quem assina o carnê"></div>
    <div class="field"><label>Telefone (para cobrança)</label><input id="cfTel" placeholder="(71) 9...."></div>
    <div class="field" style="margin-bottom:0"><label>Descrição do veículo</label><input id="cfVeic" value="${esc(s.veiculo||'')}" placeholder="Ex.: Fiat Argo 2021"></div>`,
    `<button class="btn" data-close-modal>Cancelar</button>
     <button class="btn pri" id="cfSalvar" onclick="carSalvarContrato()">Gerar carnê</button>`);
}
let salvandoCarne=false;
async function carSalvarContrato(){
  if(salvandoCarne) return;
  const s=CAR_ATUAL; if(!s){ fecharModal(); return; }
  const nome=val('cfNome').trim();
  const veic=val('cfVeic').trim();
  if(!nome){ toast('Informe o nome do comprador'); return; }
  const btn=document.getElementById('cfSalvar');
  salvandoCarne=true; if(btn){ btn.disabled=true; btn.textContent='Gerando…'; }
  const contrato={ cliente:nome, tel:val('cfTel').trim(), veiculo:veic||'Veículo',
    valorVeic:s.valor, entrada:s.entrada, financiado:s.financiado, taxa:s.taxa,
    parcelas:s.prazo, valorParcela:s.valorParcela, inicio:dFwd(0), score:s.score };
  try{
    await Dados.salvarCarne(contrato);
    DB.carne = await Dados.listarCarne();
  }catch(e){
    toast('Erro ao gerar carnê: '+(e.message||e));
    salvandoCarne=false; if(btn){ btn.disabled=false; btn.textContent='Gerar carnê'; }
    return;
  }
  salvandoCarne=false;
  CAR_ATUAL=null;   // evita fechar um segundo carnê idêntico sem re-simular
  fecharModal(); render('carne'); atualizarTags();
  toast(`Carnê de ${nome} gerado — ${s.prazo}x`);
}

/* Registrar o recebimento da próxima parcela em aberto do contrato. */
async function carPagar(id){
  const k=DB.carne.find(x=>x.id===id); if(!k) return;
  if(k.pagas>=k.parcelas){ toast('Carnê já quitado'); return; }
  try{
    const n=await Dados.pagarParcelaCarne(id);
    if(n==null){ toast('Carnê já quitado'); }
    else{ DB.carne = await Dados.listarCarne(); render('carne'); atualizarTags(); toast(`Parcela ${n} recebida`); }
  }catch(e){ toast('Erro ao registrar pagamento: '+(e.message||e)); }
}

function cgCalc(){
  const q=+document.getElementById('cgQtd').value;
  const c=+document.getElementById('cgCom').value;
  const ticketC=DB.consignados.reduce((s,x)=>s+x.anuncio,0)/Math.max(1,DB.consignados.length);
  const giro=M().giro;
  const vitrine=q*ticketC;
  const porMes=vitrine*c/100/(giro/30);
  const ano=porMes*12;
  const m=M();

  document.getElementById('cgQtdL').textContent=q;
  document.getElementById('cgQtdV').textContent=q;
  document.getElementById('cgComV').textContent=PCT(c);
  document.getElementById('cgOut').innerHTML=`
    <div class="stat-line"><span>Vitrine adicionada</span><b>${BRL(vitrine)}</b></div>
    <div class="stat-line"><span>Capital investido</span><b style="color:#5FD3A6">${BRL(0)}</b></div>
    <div class="stat-line"><span>Comissão estimada por mês</span><b style="color:var(--ambar)">${BRL(porMes)}</b></div>
    <div class="stat-line"><span>No ano</span><b style="color:#5FD3A6">${BRL(ano)}</b></div>

async function salvarVeiculo(){
  const marca=val('nvMarca'), modelo=val('nvModelo'), compra=numVal('nvCompra'), alvo=numVal('nvAlvo');
  if(!marca||!modelo||!compra||!alvo){ toast('Preencha marca, modelo, valor pago e preço de anúncio'); return; }
  // Item 7: grava de verdade no Supabase e re-hidrata o pátio a partir do banco.
  // (foto ainda é passo de Storage; venda tem passo próprio.)
  const novo={ marca, modelo, ano:val('nvAno')||'', km:numVal('nvKm'),
    placa:(val('nvPlaca')||'').toUpperCase(), cor:val('nvCor')||'',
    compra, prep:numVal('nvPrep'), alvo, status:'estoque' };
  let salvo;
  try{
    salvo = await Dados.salvarVeiculo(novo);
  }catch(e){ toast('Erro ao salvar: '+(e.message||e)); return; }
  const id = salvo.id;
  // Anexa o veículo persistido (com o id e a data do banco) em vez de re-baixar
  // tudo: não derruba estado em memória de outras telas (ex.: venda ainda não
  // persistida) e evita refetch.
  DB.veiculos.unshift({ id, marca, modelo, ano:novo.ano, km:novo.km||0, placa:novo.placa,
    cor:novo.cor, compra, prep:novo.prep||0, alvo, entrada:salvo.entrada||dFwd(0), status:'estoque',
    rn:'fora', foto:window.__foto_nvFoto||'' });
  if(window.__foto_nvFoto){                         // sobe a foto ao Storage (bucket privado)
    try{
      const url=await Dados.subirFotoVeiculo(id, window.__foto_nvFoto);
      const nv=DB.veiculos.find(x=>x.id===id); if(nv && url) nv.foto=url;
    }catch(e){ toast('Veículo salvo, mas a foto não subiu: '+(e.message||e)); }
  }
  window.__foto_nvFoto='';
  fecharModal(); go('estoque'); atualizarTags();
  toast(`${marca} ${modelo} entrou no pátio`);
}

function vdPreview(){
  const v=DB.veiculos.find(x=>x.id===val('vdVeic')); if(!v) return;
  const valor=numVal('vdValor'), com=numVal('vdCom'), banco=numVal('vdBanco');
  const lucro=(valor-custoTotal(v))+banco-com;
  const pct=custoTotal(v)?lucro/custoTotal(v)*100:0;
  // Custo/lucro só para quem vê custo — o vendedor não enxerga (custo mascarado).
  document.getElementById('vdPrev').innerHTML=`
    <div style="padding:12px;border-radius:11px;background:var(--asfalto);border:1px solid var(--linha);margin-top:2px">
      ${USER.verCustos?`<div class="stat-line"><span>Custo total do carro</span><b>${BRL(custoTotal(v))}</b></div>`:''}
      <div class="stat-line" ${USER.verLucro?'':'style="border-bottom:0"'}><span>Dias no pátio</span><b>${dias(v.entrada)}</b></div>
      ${USER.verLucro?`<div class="stat-line" style="border-bottom:0"><span>Lucro desta venda</span><b style="color:${lucro>0?'#5FD3A6':'#F58177'}">${BRL(lucro)} · ${PCT(pct)}</b></div>`:''}
    </div>`;
}
async function salvarVenda(){
  const v=DB.veiculos.find(x=>x.id===val('vdVeic'));
  const valor=numVal('vdValor');
  if(!v||!valor){ toast('Informe o valor fechado'); return; }
  // Item 8/0010: a venda é gravada pelo servidor (Edge Function `vender`), que
  // congela o custo real e baixa o carro. Só mexe na memória após confirmar.
  const venda={ desc:`${v.marca} ${v.modelo} ${String(v.ano||'').slice(0,4)}`, placa:v.placa,
    custo:USER.verCustos?custoTotal(v):0, valor, data:dFwd(0), forma:val('vdForma'),
    comissao:numVal('vdCom'), retornoBanco:numVal('vdBanco'),
    diasPatio:dias(v.entrada), cliente:val('vdCliente')||'Não informado',
    veiculoId:v.id };
  let id;
  try{
    id = await Dados.salvarVenda(venda);
  }catch(e){ toast('Erro ao registrar a venda: '+(e.message||e)); return; }
  DB.vendas.unshift({ id, ...venda });
  v.status='vendido';
  fecharModal(); go('vendas'); atualizarTags();
  // Lucro no toast só para quem vê lucro (senão o custo vazaria pelo cálculo).
  if(USER.verLucro){
    const l=(valor-custoTotal(v))+numVal('vdBanco')-numVal('vdCom');
    toast(`Venda registrada — lucro de ${BRL(l)}`);
  } else {
    toast('Venda registrada');
  }
}

let salvandoConsig=false;
async function salvarConsig(){
  if(salvandoConsig) return;
  const marca=val('cnMarca'), modelo=val('cnModelo'), anuncio=numVal('cnAnun');
  if(!marca||!modelo||!anuncio){ toast('Preencha marca, modelo e preço de anúncio'); return; }
  const c={marca,modelo,ano:val('cnAno')||'',km:numVal('cnKm'),
    placa:(val('cnPlaca')||'').toUpperCase(),dono:val('cnDono')||'',tel:val('cnTel')||'',
    minimo:numVal('cnMin'),anuncio,comissao:numVal('cnCom')||6};
  salvandoConsig=true;
  let veicId;
  try{ veicId=await Dados.salvarConsignado(c); }
  catch(e){ toast('Erro ao salvar consignado: '+(e.message||e)); salvandoConsig=false; return; }
  // foto (opcional): sobe pro bucket do veículo criado
  if(window.__foto_cnFoto){
    try{ await Dados.subirFotoVeiculo(veicId, window.__foto_cnFoto); }
    catch(e){ toast('Consignado salvo, mas a foto não subiu: '+(e.message||e)); }
  }
  window.__foto_cnFoto='';
  salvandoConsig=false;
  try{ DB.consignados = await Dados.listarConsignados(); }catch(_){}
  fecharModal(); go('consig'); atualizarTags();
  toast(`${marca} ${modelo} no pátio sem custo de capital`);
}

/* ==========================================================
   RENAVE — CAMADA DE CONTROLE
   Este módulo NÃO registra no RENAVE. O registro é feito pela
   integradora autorizada da loja. Aqui a loja enxerga o que
   está pendente, o que trava dinheiro e o que vence.
   ========================================================== */

/* prazo: Resolução CONTRAN 1.026, publicada 30/06/2026, 90 dias */
const RENAVE_PRAZO = '2026-09-28';

DB.renave = {
  habilitado:      true,
  cnpj:            '00.000.000/0001-00',
  integradora:     'Não vinculada',
  integradoraOk:   false,
  certificado:     'A1 e-CNPJ',
  certificadoVence: dFwd(43),
  detranCadastro:  true,
  uf:              'BA'
};

/* fases oficiais do fluxo */
const RN_FASES = {
  fora:      {n:'Fora do estoque',      c:'#E0574B', d:'Comprado, ainda não solicitado no RENAVE'},
  entrada:   {n:'Entrada solicitada',   c:'#F2A93B', d:'Aguardando protocolo de NF-e e ATPV-e no DETRAN'},
  regular:   {n:'Regular',              c:'#31A97C', d:'TEE emitido e CRLV-e gerado — liberado para vender'},
  saida:     {n:'Saída pendente',       c:'#B08CF0', d:'Vendido, falta gerar ATPV-e e TSE'}
};

/* estado de cada veículo no fluxo RENAVE.
   Em produção vem de v.renave_fase (banco), mapeado por veiculoParaProto.
   RN_MAP só serve de fallback para os ids de demonstração (v1..v9). */
const RN_MAP = {
  v1:'regular', v2:'regular', v3:'entrada', v4:'regular', v5:'fora',
  v6:'regular', v7:'entrada', v8:'regular', v9:'fora'
};
DB.veiculos.forEach(v=>{ v.rn = v.rn || RN_MAP[v.id] || 'fora'; });
DB.consignados.forEach((c,i)=>{ c.rnContrato = i===0; });

const rnDiasPrazo = () => Math.max(0, Math.round((new Date(RENAVE_PRAZO+'T12:00:00') - HOJE)/864e5));
const rnFase = v => v.rn || 'fora';

function rnResumo(){
  const est = patio();
  const porFase = {};
  Object.keys(RN_FASES).forEach(k=>porFase[k]=est.filter(v=>rnFase(v)===k));

  /* dinheiro travado: banco não financia veículo fora do RENAVE */
  const bloqueados = est.filter(v=>rnFase(v)!=='regular');
  const valorBloqueado = bloqueados.reduce((s,v)=>s+v.alvo,0);

  const consigSem = DB.consignados.filter(c=>!c.rnContrato);
  const valorConsigSem = consigSem.reduce((s,c)=>s+c.anuncio,0);

  const certDias = dias(DB.renave.certificadoVence) * -1;

  /* nota de conformidade */
  let nota = 100;
  nota -= (bloqueados.length / Math.max(1,est.length)) * 45;
  nota -= consigSem.length * 7;
  if(!DB.renave.integradoraOk) nota -= 25;
  if(certDias < 30) nota -= 8;
  if(!DB.renave.detranCadastro) nota -= 20;
  nota = Math.max(0, Math.round(nota));

  return {est,porFase,bloqueados,valorBloqueado,consigSem,valorConsigSem,certDias,nota};
}

/* ---------- esteira visual do fluxo ---------- */
function rnEsteira(r){
  const ordem = ['fora','entrada','regular','saida'];
  const total = Math.max(1, r.est.length);
  const W=560, H=118, pad=8;
  const larg = (W - pad*2) / ordem.length;

  const estacoes = ordem.map((k,i)=>{
    const f = RN_FASES[k], n = r.porFase[k].length;
    const x = pad + i*larg, cx = x + larg/2;
    const raio = 15 + Math.min(13, n*3.4);
    const ativo = n>0;
    return `
      ${i<ordem.length-1?`<line x1="${cx+raio+5}" y1="46" x2="${x+larg+larg/2-raio-5}" y2="46"
        stroke="${cv('--ln')}" stroke-width="2" stroke-dasharray="3 4"/>`:''}
      <circle cx="${cx}" cy="46" r="${raio}" fill="${ativo?f.c:cv('--sf2')}" fill-opacity="${ativo?.17:1}"
        stroke="${ativo?f.c:cv('--ln')}" stroke-width="${ativo?2:1.5}"/>
      <text x="${cx}" y="52" text-anchor="middle" font-size="17" font-weight="600"
        fill="${ativo?f.c:cv('--tx2')}" font-family="IBM Plex Mono">${n}</text>
      <text x="${cx}" y="88" text-anchor="middle" font-size="11.5" fill="${cv('--tx2')}"
        font-family="Archivo" font-weight="600">${f.n.split(' ')[0]}</text>
      <text x="${cx}" y="101" text-anchor="middle" font-size="11.5" fill="${cv('--tx3')}"
        font-family="Archivo">${f.n.split(' ').slice(1).join(' ')||'\u00A0'}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${estacoes}</svg>`;
}

function rnVeiculo(id){
  const v=DB.veiculos.find(x=>x.id===id); if(!v) return;

  const opts=Object.entries(RN_FASES).map(([k,x])=>
    `<option value="${k}" ${rnFase(v)===k?'selected':''}>${x.n}</option>`).join('');

  const checklist = {
    fora:    [['NF-e de compra emitida',false],['ATPV-e de entrada assinado',false],['Solicitação de entrada',false],['TEE emitido',false]],
    entrada: [['NF-e de compra emitida',true],['ATPV-e de entrada assinado',true],['Solicitação de entrada',true],['TEE emitido',false]],
    regular: [['NF-e de compra emitida',true],['ATPV-e de entrada assinado',true],['Solicitação de entrada',true],['TEE emitido',true]],
    saida:   [['ATPV-e do comprador',false],['NF-e de saída',false],['Solicitação de saída',false],['TSE emitido',false]]
  }[rnFase(v)];

  modal(`${v.marca} ${v.modelo}`,`

        <div style="font-size:var(--t-lab);color:var(--placa-3);margin-top:5px">${f.d}</div>
      </div>
    </div>

    <div style="font-size:var(--t-lab);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--placa-3);margin-bottom:9px">Etapas</div>
    ${checklist.map(([nome,ok])=>`
      <div class="stat-line">
        <span><span style="color:${ok?'#5FD3A6':'var(--placa-3)'};margin-right:8px;font-weight:700">${ok?'✓':'○'}</span>${nome}</span>
        <b style="color:${ok?'#5FD3A6':'var(--placa-3)'}">${ok?'feito':'pendente'}</b>

    <div style="margin:15px 0;padding:12px;border-radius:11px;background:var(--asfalto);border:1px solid var(--linha);font-size:var(--t-sup);line-height:1.55;color:var(--placa-2)">
      ${rnFase(v)==='regular'
        ? `Veículo regular. Pode ser vendido e <b style="color:#5FD3A6">financiado normalmente</b>.`

           São <b style="color:#F58177">${BRL(v.alvo)}</b> em vitrine sem possibilidade de financiamento.`}

    <div class="field" style="margin-bottom:0">

let salvandoRn=false;
async function rnSalvar(id){
  if(salvandoRn) return;
  const v=DB.veiculos.find(x=>x.id===id); if(!v) return;
  const fase=val('rnStatus');
  salvandoRn=true;
  try{
    await Dados.atualizarVeiculo(id, {renave_fase:fase});
  }catch(e){
    toast('Erro ao salvar: '+(e.message||e));
    salvandoRn=false; return;
  }
  v.rn=fase; salvandoRn=false;
  fecharModal(); render('renave'); atualizarTags();
  toast(`${v.placa} — ${RN_FASES[v.rn].n}`);
}

  const v=DB.veiculos.find(x=>x.id===val('nfVeic'));
  const btn=document.getElementById('nfBtn');
  emitindoNota=true; if(btn){ btn.disabled=true; btn.textContent='Registrando…'; }

      desc:v?`${v.marca} ${v.modelo} ${String(v.ano||'').slice(0,4)}`:val('nfDesc')||'',
      tipo:'saida' });

    emitindoNota=false; if(btn){ btn.disabled=false; btn.textContent='Registrar nota'; }

async function anToggle(id){
  const p=DB.portais.find(x=>x.id===id); if(!p) return;
  const novo=!p.ativo;
  try{ await Dados.salvarPortal(p.nome, { ativo:novo }); }
  catch(e){ toast('Não consegui salvar: '+(e.message||e)); return; }
  p.ativo=novo;
  if(p.ativo){ p.publicados=Math.min(p.limite,patio().length); p.status='ok'; }
  else { p.publicados=0; p.leads=0; p.status='off'; }
  render('anuncios'); atualizarTags();
  toast(p.ativo?`${esc(p.nome)} ligado — entra no feed padrão`:`${esc(p.nome)} desligado`);
}
function anPublicar(){
  const ativos=DB.portais.filter(p=>p.ativo);
  const est=patio();
  modal('Publicando estoque',`

    `<button class="btn" data-close-modal>Fechar</button>`);
  const log=document.getElementById('anLog');
  ativos.forEach((p,i)=>{
    setTimeout(()=>{
      log.innerHTML+=`<div><span style="color:${p.cor2||p.cor}">■</span> ${esc(p.nome)} — ${Math.min(p.limite,est.length)} veículos enviados <span style="color:#5FD3A6">ok</span></div>`;
      p.publicados=Math.min(p.limite,est.length); p.ultimo=dFwd(0);
      if(i===ativos.length-1){

          log.innerHTML+=`<div style="margin-top:9px;color:#5FD3A6">Sincronização concluída.</div>`;

    },380*(i+1));
  });
}

const AVAL = {fipe:72000, km:65000, estado:'bom', pneus:'meia-vida', doc:'ok', sinistro:'nao', procura:'media'};

  return `

          <option value="otimo">Ótimo — sem retoque aparente</option>

          <option value="grande">Sinistro de média monta</option></select></div>
        <div class="field" style="margin-bottom:0"><label>Procura pelo modelo</label>
          <select id="avProcura" onchange="avCalc()">
            <option value="alta">Alta — sai rápido</option>
            <option value="media" selected>Média</option>
            <option value="baixa">Baixa — encalha</option></select></div>
      </div>
    </div>
  </div>
  <div id="avOut" class="sec"></div>`;

function avCalc(){
  const fipe=+document.getElementById('avFipe').value||0;
  const km=+document.getElementById('avKm').value||0;
  const estado=document.getElementById('avEstado').value;
  const pneus=document.getElementById('avPneus').value;
  const doc=document.getElementById('avDoc').value;
  const sin=document.getElementById('avSin').value;
  const proc=document.getElementById('avProcura').value;
  const nome=document.getElementById('avNome').value||'Veículo do cliente';

  const desc=[];
  let base=fipe;

  const kmRef=60000, excedente=Math.max(0,km-kmRef);
  const dKm=Math.min(fipe*0.10, excedente/10000*fipe*0.018);
  if(dKm>200) desc.push(['Quilometragem acima da média',-dKm]);

  const rEstado={otimo:0,bom:.02,regular:.055,ruim:.10}[estado];
  if(rEstado) desc.push(['Estado de lataria e pintura',-fipe*rEstado]);

  const rPneus={novos:0,'meia-vida':.008,trocar:.022}[pneus];
  if(rPneus) desc.push(['Pneus',-fipe*rPneus]);

  const rDoc={ok:0,ipva:.03,multas:.02,alienado:.05}[doc];
  if(rDoc) desc.push(['Pendência de documentação',-fipe*rDoc]);

  const rSin={nao:0,pequeno:.09,grande:.22}[sin];
  if(rSin) desc.push(['Histórico de sinistro',-fipe*rSin]);

  const rProc={alta:-.015,media:0,baixa:.04}[proc];
  if(rProc) desc.push(['Liquidez do modelo',-fipe*rProc]);

  const totalDesc=desc.reduce((s,d)=>s+d[1],0);
  const valorReal=base+totalDesc;

  const prep=Math.round((fipe*0.022+(pneus==='trocar'?1800:0)+(estado==='regular'?2200:estado==='ruim'?4500:600))/50)*50;
  const margemAlvo=0.13;
  const revenda=Math.round((valorReal*0.99)/100)*100;
  const maxPagar=Math.round(((revenda-prep)/(1+margemAlvo))/100)*100;
  const seguro=Math.round(maxPagar*0.96/100)*100;

  const giro={alta:22,media:38,baixa:64}[proc];
  const lucro=revenda-maxPagar-prep;

  document.getElementById('avOut').innerHTML=`
    <div class="card" style="border-color:rgba(242,169,59,.35)">
      <div class="card-b aval-nota">
        <div style="font-size:var(--t-lab);letter-spacing:.12em;text-transform:uppercase;color:var(--placa-3);font-weight:700">Pague no máximo</div>
        <div class="n" style="color:var(--ambar)">${BRL(maxPagar)}</div>
        <div style="font-size:var(--t-sup);color:var(--placa-2);margin-top:7px">
          comece oferecendo <b class="num" style="color:var(--placa)">${BRL(seguro)}</b> e tenha espaço para negociar
        </div>
      </div>
    </div>

    <div class="grid g22" style="margin-top:12px">
      <div class="card"><div class="card-h"><div style="flex:1"><h3>Como cheguei nesse número</h3></div></div>
        <div class="card-b">
          <div class="stat-line"><span>Valor de tabela</span><b>${BRL(fipe)}</b></div>
          ${desc.map(([n,v])=>`<div class="stat-line"><span>${n}</span><b style="color:#F58177">${BRL(v)}</b></div>`).join('')}
          <div class="stat-line"><span>Valor real do carro</span><b style="color:var(--placa)">${BRL(valorReal)}</b></div>
          <div class="stat-line"><span>Preparação estimada</span><b style="color:#F58177">− ${BRL(prep)}</b></div>
          <div class="stat-line"><span>Margem de ${PCT(margemAlvo*100)}</span><b>${BRL(revenda-maxPagar-prep)}</b></div>
        </div>
      </div>
      <div class="card"><div class="card-h"><div style="flex:1"><h3>Se entrar no estoque</h3></div></div>
        <div class="card-b">
          <div class="stat-line"><span>Anunciar por</span><b style="color:var(--ambar)">${BRL(revenda)}</b></div>
          <div class="stat-line"><span>Lucro previsto</span><b style="color:#5FD3A6">${BRL(lucro)}</b></div>
          <div class="stat-line"><span>Giro esperado</span><b>${giro} dias</b></div>
          <div class="stat-line"><span>Retorno por dia parado</span><b>${BRL(lucro/giro)}</b></div>
          <div style="margin-top:12px;padding:11px;border-radius:11px;background:var(--asfalto);border:1px solid var(--linha);font-size:var(--t-sup);line-height:1.55;color:var(--placa-2)">
            ${sin!=='nao'
              ? `Carro com sinistro registrado. Além do desconto já aplicado, avise o comprador: <b style="color:var(--placa)">omitir isso gera devolução e processo</b>.`
              : proc==='baixa'
              ? `Modelo de baixa procura: ${giro} dias de pátio em média. Só aceite se o desconto compensar o capital parado.`
              : `Boa liquidez. Esse carro devolve <b style="color:#5FD3A6">${BRL(lucro/giro)}</b> por dia de pátio — acima da média da loja.`}
          </div>
        </div>
      </div>
    </div>

    <button class="btn pri blk" style="margin-top:12px" onclick="avSalvar('${esc(nome)}',${maxPagar},${revenda})">
      ${svgi('<path d="M12 5v14M5 12h14"/>')}Registrar avaliação e enviar proposta</button>`;
}

let salvandoMembro=false;
async function salvarMembro(id){
  if(salvandoMembro) return;
  const nome=val('mbNome'); if(!nome){ toast('Informe o nome'); return; }
  const mods=[...document.querySelectorAll('[data-mod].on')].map(e=>e.dataset.mod);
  const papelChave=val('mbPapel');
  const verCustos=document.getElementById('mbCustos').classList.contains('on');
  const verLucro=document.getElementById('mbLucro').classList.contains('on');
  const tel=val('mbTel');
  const btn=document.getElementById('mbSalvar');
  salvandoMembro=true; if(btn){ btn.disabled=true; btn.textContent='Salvando…'; }
  try{
    if(!id){
      const email=val('mbEmail');
      const r=await Dados.criarMembro({ nome, email, tel, papelChave, modulos:mods, verCustos, verLucro });
      fecharModal();
      try{ DB.usuarios = await Dados.listarEquipe(); }catch(_){}
      render('equipe'); atualizarTags();
      mostrarSenha(r.email, r.senha);
    } else {
      const aBtn=document.getElementById('mbAtivo');
      const ativo=aBtn?aBtn.classList.contains('on'):undefined;
      await Dados.atualizarMembro({ id, nome, tel, papelChave, modulos:mods, verCustos, verLucro, ...(ativo!=null?{ativo}:{}) });
      const u=DB.usuarios.find(x=>x.id===id);
      if(u) Object.assign(u,{nome,tel,papel:PAPEL_ROTULO[papelChave]||papelChave,papelChave,modulos:mods,verCustos,verLucro,iniciais:iniciaisDe(nome),...(ativo!=null?{ativo}:{})});
      if(id===USER.id){
        USER.papelChave=papelChave; USER.papel=PAPEL_ROTULO[papelChave]||papelChave;
        USER.modulos=mods; USER.verCustos=verCustos; USER.verLucro=verLucro;
        USER.nome=nome; USER.tel=tel; USER.iniciais=iniciaisDe(nome);
        aplicarPermissoes();
      }
      fecharModal(); render('equipe'); atualizarTags(); toast('Membro atualizado');
    }
  }catch(e){
    toast('Erro: '+(e.message||e));
    if(btn){ btn.disabled=false; btn.textContent=id?'Salvar':'Criar acesso'; }
  }finally{ salvandoMembro=false; }
}

/* ==========================================================
   ANALISTA RR — motor de análise
   Lê os dados reais da loja e devolve risco / oportunidade.
   ========================================================== */
function analisar(){
  const m=M(); const out=[];
  const est=m.est;

  /* 1. capital parado */
  m.parados.sort((a,b)=>dias(b.entrada)-dias(a.entrada)).forEach(v=>{
    const d=dias(v.entrada);
    const custoMes=custoTotal(v)*0.0135;
    const piso=Math.round((custoTotal(v)*1.06)/100)*100;
    out.push({tipo:d>90?'risk':'warn', peso:d>90?3:2,
      titulo:`${vNome(v)} há ${d} dias no pátio`,
      texto:`São <b>${BRL(custoTotal(v))}</b> parados, custando cerca de <b>${BRL(custoMes)}</b> por mês em capital imobilizado. Vender a <b>${BRL(piso)}</b> ainda deixa 6% de margem e libera dinheiro para dois carros de giro rápido.`});
  });

  /* 2. concentração de capital */
  const maior=est.slice().sort((a,b)=>custoTotal(b)-custoTotal(a))[0];
  if(maior && custoTotal(maior)/m.capital>0.15){
    out.push({tipo:'risk',peso:3,
      titulo:`${PCT(custoTotal(maior)/m.capital*100)} do capital em um só carro`,
      texto:`A ${esc(maior.modelo)} sozinha segura <b>${BRL(custoTotal(maior))}</b> do pátio. Se ela demorar, o caixa inteiro sente. Para o porte da loja, o ideal é nenhum veículo passar de 12% do estoque.`});
  }

  /* 3. margem abaixo do padrão */
  est.filter(v=>margemPct(v)<9).forEach(v=>{
    out.push({tipo:'warn',peso:1,
      titulo:`Margem apertada na ${esc(v.modelo)}`,
      texto:`Anunciada com <b>${PCT(margemPct(v))}</b> sobre o custo, contra ${PCT(m.margemMedia)} de média da loja. Sem espaço para negociar: qualquer desconto zera o lucro.`});
  });

  /* 4. follow-up vencido */
  const atras=DB.leads.filter(l=>!['fechado','perdido'].includes(l.etapa)&&l.proximo&&l.proximo<dFwd(0));
  if(atras.length){
    out.push({tipo:'risk',peso:3,
      titulo:`${atras.length} cliente(s) esperando retorno`,
      texto:`${atras.map(l=>esc(l.nome)).join(', ')} passaram da data combinada, somando <b>${BRL(atras.reduce((s,l)=>s+l.orcamento,0))}</b> em orçamento. Lead de loja de carro esfria em 48 horas — essa é a venda mais barata que existe.`});
  }

  /* 5. inadimplência no carnê */
  if(m.inadimplente.length){
    const k=m.inadimplente[0];
    out.push({tipo:'risk',peso:2,
      titulo:`Carnê de ${esc(k.cliente)} com ${k.atraso} dias de atraso`,
      texto:`Restam <b>${BRL(pmt(k.financiado,k.taxa,k.parcelas)*(k.parcelas-k.pagas))}</b> a receber nesse contrato. Perfil ${k.score} entra em atraso em ~22% dos casos: acione hoje, antes de virar 30 dias.`});
  }

  /* 5b. RENAVE — prazo legal */
  const rr = rnResumo();
  const dPrazo = rnDiasPrazo();
  if(!DB.renave.integradoraOk){
    out.push({tipo:'risk',peso:5,
      titulo:`Loja sem integradora do RENAVE — ${dPrazo} dias de prazo`,
      texto:`Sem vínculo com integradora credenciada, nenhum veículo entra ou sai do RENAVE. Hoje isso trava <b>${BRL(rr.valorBloqueado)}</b> em vitrine, porque banco não libera financiamento de carro fora do sistema. É a pendência mais cara do painel.`});
  }
  if(rr.bloqueados.length){
    out.push({tipo:'risk',peso:4,
      titulo:`${rr.bloqueados.length} veículo(s) irregulares no RENAVE`,
      texto:`${rr.bloqueados.slice(0,3).map(v=>v.placa).join(', ')}${rr.bloqueados.length>3?' e outros':''} somam <b>${BRL(rr.valorBloqueado)}</b> que não podem ser financiados. Cada um desses é uma venda que cai na hora da aprovação de crédito.`});
  }
  if(rr.consigSem.length){
    out.push({tipo:'risk',peso:3,
      titulo:`${rr.consigSem.length} consignado(s) sem contrato eletrônico`,
      texto:`A resolução veda a intermediação sem registro prévio no RENAVE. São <b>${BRL(rr.valorConsigSem)}</b> em vitrine que hoje não podem ser vendidos legalmente.`});
  }
  if(rr.certDias<45 && rr.certDias>0){
    out.push({tipo:'warn',peso:2,
      titulo:`Certificado digital vence em ${rr.certDias} dias`,
      texto:`Sem certificado válido a loja para de operar no RENAVE de um dia para o outro. Renove antes de ${dataBR(DB.renave.certificadoVence)}.`});
  }

  /* 5c. fiscal e anúncios */
  const rej = DB.notas.filter(n=>n.status==='rejeitada');
  if(rej.length){
    out.push({tipo:'risk',peso:4,
      titulo:`${rej.length} nota fiscal rejeitada pela SEFAZ`,
      texto:`A venda de <b>${esc(rej[0].dest)}</b> (${BRL(rej[0].valor)}) está sem documento fiscal válido. Enquanto não for corrigida, o carro não transfere e a receita não entra na contabilidade.`});
  }
  const offs = DB.portais.filter(p=>!p.ativo);
  if(offs.length>=2){
    out.push({tipo:'opp',peso:2,
      titulo:`${offs.length} portais de anúncio desligados`,
      texto:`${offs.map(p=>esc(p.nome)).join(' e ')} estão desconectados. Os ${DB.portais.filter(p=>p.ativo).length} ativos já trazem <b>${DB.portais.reduce((s,p)=>s+p.leads,0)} leads por mês</b> — ligar os demais custa apenas o plano de cada portal, e a publicação é automática.`});
  }
  const ctAg = DB.contratos.filter(c=>c.status==='aguardando');
  if(ctAg.length){
    out.push({tipo:'warn',peso:2,
      titulo:`${ctAg.length} contrato aguardando assinatura`,
      texto:`${ctAg.map(c=>esc(c.cliente)).join(', ')} — <b>${BRL(ctAg.reduce((s,c)=>s+c.valor,0))}</b> em negócios que ainda não estão formalizados. Um lembrete pelo WhatsApp resolve na maioria dos casos.`});
  }

  /* 6. oportunidade: modelo que gira rápido */
  const porFaixa={};
  DB.vendas.forEach(v=>{
    const marca=v.desc.split(' ')[0];
    porFaixa[marca]=porFaixa[marca]||{q:0,d:0,l:0};
    porFaixa[marca].q++; porFaixa[marca].d+=v.diasPatio;
    porFaixa[marca].l+=(v.valor-v.custo)+v.retornoBanco-v.comissao;
  });
  const melhor=Object.entries(porFaixa).filter(([,x])=>x.q>=2)
    .map(([k,x])=>({k,giro:x.d/x.q,lucro:x.l/x.q,q:x.q}))
    .sort((a,b)=>(b.lucro/b.giro)-(a.lucro/a.giro))[0];
  if(melhor){
    out.push({tipo:'opp',peso:3,
      titulo:`${melhor.k} é o que mais rende por dia de pátio`,
      texto:`Média de <b>${BRL(melhor.lucro)}</b> de lucro em <b>${Math.round(melhor.giro)} dias</b> — cerca de ${BRL(melhor.lucro/melhor.giro)} por dia de capital aplicado. Comprar mais ${melhor.k} na faixa do ticket médio é o caminho de menor risco para expandir.`});
  }

  /* 7. oportunidade: faixa de ticket que mais gira */
  const rapidos=DB.vendas.filter(v=>v.diasPatio<=30);
  if(rapidos.length){
    const tk=rapidos.reduce((s,v)=>s+v.valor,0)/rapidos.length;
    out.push({tipo:'opp',peso:2,
      titulo:`Carros até ${BRL(tk)} saem em menos de 30 dias`,
      texto:`${rapidos.length} das ${DB.vendas.length} vendas ficaram menos de um mês no pátio, todas nessa faixa. Já os acima de ${BRL(120000)} passam de ${Math.round(DB.vendas.filter(v=>v.valor>120000).reduce((s,v)=>s+v.diasPatio,0)/Math.max(1,DB.vendas.filter(v=>v.valor>120000).length))} dias. Mais unidades baratas giram mais dinheiro que uma cara.`});
  }

  /* 8. consignação */
  out.push({tipo:'opp',peso:3,
    titulo:`Consignação: vitrine de ${BRL(m.vitrineConsig)} sem gastar capital`,
    texto:`Os ${DB.consignados.length} carros de terceiros geram até <b>${BRL(m.potencialConsig)}</b> em comissão sem risco de estoque. Dobrando para 6 consignados, a comissão cobriria boa parte do custo fixo mensal de ${BRL(m.fixas)}.`});

  /* 9. origem de lead mais rentável */
  const ori={};
  DB.leads.forEach(l=>{ori[l.origem]=ori[l.origem]||{t:0,f:0}; ori[l.origem].t++; if(l.etapa==='fechado')ori[l.origem].f++;});
  const bestOri=Object.entries(ori).sort((a,b)=>(b[1].f/b[1].t)-(a[1].f/a[1].t))[0];
  if(bestOri && bestOri[1].f>0){
    out.push({tipo:'opp',peso:1,
      titulo:`${bestOri[0]} converte melhor que o resto`,
      texto:`${bestOri[1].f} fechamento(s) em ${bestOri[1].t} contatos. Com ${BRL(DB.despesas.find(d=>d.cat==='Marketing')?.valor||0)} de verba mensal, vale concentrar em vez de espalhar.`});
  }

  /* 10. ponto de equilíbrio */
  const falta=Math.ceil(m.pontoEquilibrio)-m.doMes.length;
  out.push({tipo: falta>0?'warn':'opp', peso:2,
    titulo: falta>0?`Faltam ${falta} carros para o mês fechar no azul`:`Mês já cobriu o custo fixo`,
    texto: falta>0
      ? `O custo total do mês é <b>${BRL(m.despesaMes)}</b>. Na margem média de ${PCT(m.margemMedia)} e ticket de ${BRL(m.ticket)}, cada carro contribui com cerca de ${BRL(m.ticket*m.margemMedia/100)}. Há ${DB.leads.filter(l=>l.etapa==='proposta').length} proposta(s) em aberto que resolvem isso.`
      : `Tudo que for vendido a partir de agora é lucro líquido: <b>${BRL(m.lucroLiqMes)}</b> acumulados no mês.`});

  return out.sort((a,b)=>b.peso-a.peso);
}

function saudeScore(m,ins){
  let s=100;
  s -= Math.min(28, m.capitalParado/m.capital*100*0.9);          // capital travado
  s -= Math.min(16, Math.max(0,(m.giro-35))*0.7);                 // giro lento
  s += Math.min(10, Math.max(0,(m.margemMedia-11))*2.5);          // margem boa
  s -= m.inadimplente.length*4;                                   // calote
  s -= DB.leads.filter(l=>!['fechado','perdido'].includes(l.etapa)&&l.proximo&&l.proximo<dFwd(0)).length*3;
  s -= m.lucroLiqMes<0?12:0;
  const rc = rnResumo();
  s -= Math.min(18, (rc.bloqueados.length/Math.max(1,rc.est.length))*18);
  if(!DB.renave.integradoraOk) s -= 8;
  const maior=m.est.slice().sort((a,b)=>custoTotal(b)-custoTotal(a))[0];
  if(maior && custoTotal(maior)/m.capital>0.15) s-=7;
  return Math.max(5,Math.min(99,Math.round(s)));
}

const INTENCAO_NAV = ['onde','aonde','cade','cadê','como faço','como eu faço','como faco','não acho',
  'nao acho','não estou achando','nao estou achando','não encontro','nao encontro','me leva','me leve',
  'ir para','vai para','abrir','abre','abra','quero','preciso','como emito','como emitir','como lanço',
  'como lancar','como lançar','como cadastro','como cadastrar','como registro','como registrar',
  'como gero','como gerar','como simulo','como simular','em que lugar','qual página','qual pagina',
  'onde fica','onde que','me mostra','me ensina','como uso','como usar','tem como'];

function detectarNavegacao(t){
  const querIr = INTENCAO_NAV.some(w=>t.includes(w));
  if(!querIr) return null;
  let melhor=null, pontos=0;
  for(const dest of ONDE_FICA){
    let p=0;
    for(const termo of dest.termos){
      if(!t.includes(termo)) continue;
      /* termos genéricos valem pouco; termos específicos valem muito */
      const generico=['cliente','clientes','carro','carros','contato','entrada','prazo','conta','papel','documento'].includes(termo);
      p += generico ? 1 : termo.length*2;
    }
    if(p>pontos){ pontos=p; melhor=dest; }
  }
  return pontos>0 ? melhor : 'ajuda';
}

function respostaNavegacao(dest){
  if(dest==='ajuda'){
    return `Me diz o que você quer fazer que eu te levo direto.\n\n`+
    `Alguns exemplos do jeito que você falaria:\n\n`+
    `• “onde eu emito a nota do cliente”\n`+
    `• “quero lançar uma venda”\n`+
    `• “como faço pra avaliar o carro da troca”\n`+
    `• “preciso mandar um contrato pra assinar”\n`+
    `• “onde vejo quem tá esperando retorno”\n\n`+
    `<hr>Pode falar do seu jeito, sem nome técnico. Eu entendo e te levo.`;
  }
  if(!pode(dest.k)){
    return `A tela de <b>${dest.n}</b> existe, mas seu acesso não inclui ela.\n\n`+
      `Quem libera é o proprietário, em <b>Engrenagem › Equipe</b>.`;
  }
  return `Fica em <b>${dest.caminho}</b>.\n\n`+
    `Lá você consegue ${dest.faz}.\n\n`+
    `<button class="btn pri" style="margin-top:4px" onclick="fecharIa();go('${dest.k}')">`+
    `Abrir ${dest.n} agora</button>`;
}

/* atalho: botão de destino no fim das respostas de assunto */
function botaoIr(k,rotulo){
  if(!pode(k)) return '';
  const d=ONDE_FICA.find(x=>x.k===k); if(!d) return '';
  return `\n\n<button class="btn" style="margin-top:4px" onclick="fecharIa();go('${k}')">`+
         `${rotulo||('Abrir '+d.n)}</button>`;
}

function abrirIa(){

    const rs=ins.filter(i=>i.tipo==='risk').length;

function msgBot(html){
  const b=document.getElementById('iaBody');
  const d=document.createElement('div'); d.className='msg bot'; d.innerHTML=html;
  b.appendChild(d); b.scrollTop=b.scrollHeight;
}
function msgMe(txt){
  const b=document.getElementById('iaBody');
  const d=document.createElement('div'); d.className='msg me'; d.textContent=txt;
  b.appendChild(d); b.scrollTop=b.scrollHeight;
}
/* lê a resposta em voz alta (quando a voz está ligada). Tira o HTML e fala. */
function falar(html){
  if(!window.__vozOn || !('speechSynthesis' in window)) return;
  const d=document.createElement('div'); d.innerHTML=String(html).replace(/<hr>/g,'. ');
  const txt=(d.textContent||'').replace(/\s+/g,' ').trim();
  if(!txt) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt); u.lang='pt-BR'; u.rate=1.03; speechSynthesis.speak(u); }catch(_){}
}
function perguntar(q){
  if(!q.trim()) return;
  msgMe(q);
  const b=document.getElementById('iaBody');
  const t=document.createElement('div');
  t.className='msg bot typing'; t.innerHTML='<i></i><i></i><i></i>';
  b.appendChild(t); b.scrollTop=b.scrollHeight;
  const resp=responder(q);
  setTimeout(()=>{ t.remove(); msgBot(resp); falar(resp); }, 620+Math.random()*420);
}

/* ---- Áudio no Copiloto: falar (voz→texto) e ouvir (texto→voz) ---- */
(function(){
  // Ouvir as respostas em voz alta (Text-to-Speech)
  const vozBtn=document.getElementById('iaVoz');
  window.__vozOn=false;
  if('speechSynthesis' in window && vozBtn){
    vozBtn.style.display='';
    vozBtn.onclick=()=>{
      window.__vozOn=!window.__vozOn;
      vozBtn.style.color=window.__vozOn?'#5FD3A6':'';
      const onda=document.getElementById('iaVozOnda'); if(onda) onda.style.display=window.__vozOn?'':'none';
      if(!window.__vozOn) try{ speechSynthesis.cancel(); }catch(_){}
      if(typeof toast==='function') toast(window.__vozOn?'Voz ligada — vou ler as respostas':'Voz desligada');
    };
  }
  // Falar em vez de digitar (Speech-to-Text)
  const micBtn=document.getElementById('iaMic');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR && micBtn){
    micBtn.style.display='';
    let recog=null, ouvindo=false;
    const parar=()=>{ ouvindo=false; micBtn.style.color='var(--placa-2)'; micBtn.style.background='var(--asfalto)'; };
    micBtn.onclick=()=>{
      if(ouvindo){ try{ recog&&recog.stop(); }catch(_){} return; }
      try{
        recog=new SR(); recog.lang='pt-BR'; recog.interimResults=true; recog.continuous=false;
        recog.onresult=e=>{ let txt=''; for(let i=0;i<e.results.length;i++) txt+=e.results[i][0].transcript; iaIn.value=txt; };
        recog.onerror=()=>{ parar(); };
        recog.onend=()=>{ parar(); const q=iaIn.value.trim(); if(q){ perguntar(q); iaIn.value=''; iaIn.style.height='auto'; } };
        iaIn.value=''; recog.start(); ouvindo=true; micBtn.style.color='#F58177'; micBtn.style.background='rgba(245,129,119,.14)';
        if(typeof toast==='function') toast('Pode falar…');
      }catch(_){ parar(); }
    };
  }
})();

          <label style="display:block;font-size:13px;opacity:.8;margin-bottom:6px">Senha</label>
          <input id="loginSenha" type="password" autocomplete="current-password" required
            style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #2A2A2D;background:#0A0A0B;color:#F4F4F3;font-size:15px;margin-bottom:16px">
          <div id="loginErro" style="display:none;color:#ff6b6b;font-size:13px;margin-bottom:14px"></div>
          <button id="loginBtn" type="submit" style="width:100%;padding:12px;border:0;border-radius:10px;background:#F79A1B;color:#17130A;font-size:15px;font-weight:700;cursor:pointer">Entrar</button>
          <div style="text-align:center;margin-top:18px;font-size:12px;opacity:.55">
            <a href="${SITE_INSTITUCIONAL}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">
              feito e produzido por <b style="font-weight:700">ZelAuto</b> ↗</a>
          </div>
        </form>
      </div>`);
    document.body.appendChild(overlay);
    overlay.querySelector('#loginForm').addEventListener('submit', onSubmit);
  }

  // Página "acesse pelo link da loja" — mostrada quando NÃO há slug (sem login,
  // sem busca, sem lista). O botão abre o WhatsApp do suporte.
  function montarSemLink(){
    const wpp='https://wa.me/'+SUPORTE_WPP+'?text='+encodeURIComponent('Olá! Não tenho o link de acesso da minha loja no ZelAuto.');
    const form=overlay.querySelector('#loginForm');
    if(!form) return;
    form.removeAttribute('id');            // não é mais o form de login
    form.innerHTML=`
      <div style="text-align:center">
        <div style="font-size:22px;font-weight:700;margin-bottom:10px">ZelAuto</div>
        <div style="font-size:15px;line-height:1.6;opacity:.85">
          O acesso é pelo <b>link da sua loja</b>.<br>
          Use o endereço que você recebeu na entrega — vale salvar nos favoritos.
        </div>
        <a href="${wpp}" target="_blank" rel="noopener"
           style="display:flex;align-items:center;justify-content:center;gap:9px;width:100%;box-sizing:border-box;margin-top:22px;padding:13px;border-radius:10px;background:#25D366;color:#062;font-size:15px;font-weight:700;text-decoration:none">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5c.1-.2.1-.3 0-.5l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.5.1-.7.3a3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.3.5 1.9.6 2.6.5.4-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1z"/></svg>
          Não tenho o link
        </a>
        <div style="margin-top:18px;font-size:12px;opacity:.55">
          <a href="${SITE_INSTITUCIONAL}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">
            conheça o <b style="font-weight:700">ZelAuto</b> ↗</a>
        </div>
      </div>`;
  }
  // slug da URL: ?loja=vancar, ou o último segmento do caminho (/vancar)
  function slugDaUrl(){
    let s='';
    try{ s=(new URLSearchParams(location.search).get('loja')||'').trim().toLowerCase(); }catch(_){}
    if(!s){
      const seg=(location.pathname.split('/').filter(Boolean).pop()||'').toLowerCase();
      if(/^[a-z0-9][a-z0-9-]{1,39}$/.test(seg) && !seg.includes('.')) s=seg;
    }
    return s;
  }
  // pinta a marca da loja na tela de login (nome, logo, cor). O slug é só marca;
  // a loja da sessão vem sempre do perfil no JWT — o slug nunca dá acesso.
  async function pintarMarca(){
    const slug=slugDaUrl();
    if(!slug || !window.Dados || !Dados.marcaDaLoja) return;
    let m=null; try{ m=await Dados.marcaDaLoja(slug); }catch(_){}
    if(!m || !overlay) return;
    const nomeEl=overlay.querySelector('#loginLoja');
    const subEl=overlay.querySelector('#loginSub');
    const logoEl=overlay.querySelector('#loginLogo');
    if(nomeEl && m.nome) nomeEl.textContent=m.nome;                 // textContent: sem XSS
    if(subEl) subEl.textContent='Sistema da loja · ZelAuto';
    if(logoEl && /^https:\/\//i.test(m.logoUrl||'')){ logoEl.src=m.logoUrl; logoEl.alt=m.nome||''; logoEl.style.display='block'; }
    // A marca da loja aparece no logo + nome; o botão fica no laranja ZelAuto.
    // A cor da loja (m.cor) é usada no site público dela, não recolore o app.
  }
  function mostrarErro(msg){ const e=overlay.querySelector('#loginErro'); if(e){ e.textContent=msg; e.style.display='block'; } }
  function mostrarLogin(){
    construirOverlay(); overlay.style.display='flex';
    // Sem slug: nada de login — só a página "acesse pelo link da loja".
    // Com slug: login com a marca da loja.
    if(slugDaUrl()) pintarMarca();
    else montarSemLink();
  }
  function esconderLogin(){ if(overlay) overlay.style.display='none'; }

  async function aplicarSessao(){
    const perfil = await Dados.carregarPerfil();
    if(!perfil) return false;
    USER = perfil;                                  // reatribui o global do protótipo
    USER.papelChave = perfil.papel;                 // guarda o enum (autoriza a UI de equipe)
    USER.papel = LABELS[perfil.papel] || perfil.papel;
    if(!USER.iniciais) USER.iniciais = (USER.nome||'?').trim().slice(0,2).toUpperCase();
    // Itens 7–8: veículos, clientes e vendas vêm do banco. As demais telas
    // seguem no DB em memória. Em erro NÃO mantemos o seed fictício (num produto
    // multi-loja, mostrar dado falso/de outra loja é pior que vazio): esvazia e
    // avisa. Dispara as leituras em paralelo (tabelas independentes), mas trata
    // cada falha por conta própria (uma não derruba a outra).
    const pVeic = Dados.listarVeiculos();
    const pCli  = Dados.listarClientes();
    const pVend = Dados.listarVendas();
    const pDesp = Dados.listarDespesas();
    const pEqui = Dados.listarEquipe();
    try{ DB.veiculos = await pVeic; }
    catch(e){
      console.error('[ZelAuto] falha ao carregar veículos do banco:', e);
      DB.veiculos = [];
      if(typeof toast==='function') toast('Não consegui carregar o estoque. Verifique a conexão e recarregue.');
    }
    try{ DB.leads = await pCli; }
    catch(e){
      console.error('[ZelAuto] falha ao carregar clientes do banco:', e);
      DB.leads = [];
      if(typeof toast==='function') toast('Não consegui carregar os clientes. Verifique a conexão e recarregue.');
    }
    try{ DB.vendas = await pVend; }
    catch(e){
      console.error('[ZelAuto] falha ao carregar vendas do banco:', e);
      DB.vendas = [];
      if(typeof toast==='function') toast('Não consegui carregar as vendas. Verifique a conexão e recarregue.');
    }
    try{ DB.despesas = await pDesp; }
    catch(e){
      console.error('[ZelAuto] falha ao carregar despesas do banco:', e);
      DB.despesas = [];
      if(typeof toast==='function') toast('Não consegui carregar as despesas. Verifique a conexão e recarregue.');
    }
    try{ DB.usuarios = await pEqui; }
    catch(e){
      console.error('[ZelAuto] falha ao carregar a equipe do banco:', e);
      DB.usuarios = [USER];   // ao menos o próprio usuário logado (perfil real)
      if(typeof toast==='function') toast('Não consegui carregar a equipe. Verifique a conexão e recarregue.');
    }
    try{ window.LOJA = await Dados.carregarLoja(); }catch(_){ window.LOJA=null; }   // marca própria (site)
    // DB.loja deixa de ser demo SEMPRE: se a loja real não carregou (erro/rede),
    // não mantém o seed 'Vancar/45000' — mostrar dado falso é pior que vazio.
    DB.loja = { ...DB.loja,
      nome: (window.LOJA && window.LOJA.nome) || USER.nome || 'Sua loja',
      metaMes: (window.LOJA && window.LOJA.metaMes) || 0, caixa: 0 };
    // Telas ainda não persistidas (fases 2+): zera o seed de demonstração para a
    // loja real NÃO ver dado falso. Passam a mostrar vazio até serem ligadas.
    // Notas fiscais já persistem (fase 4: número + registro; emissão real no provedor).
    try{ DB.notas = await Dados.listarNotas(); }
    catch(e){ console.error('[ZelAuto] falha ao carregar notas:', e); DB.notas=[]; }
    // Portais já persistem (fase 5: status + limite; sync real no provedor).
    try{ DB.portais = montarPortais(await Dados.listarPortais()); }
    catch(e){ console.error('[ZelAuto] falha ao carregar portais:', e); DB.portais=montarPortais([]); }
    // Consignação já persiste (veiculo origem='consignado' + consignacoes).
    try{ DB.consignados = await Dados.listarConsignados(); }
    catch(e){ console.error('[ZelAuto] falha ao carregar consignados:', e); DB.consignados=[];
      if(typeof toast==='function') toast('Não consegui carregar os consignados. Verifique a conexão e recarregue.'); }
    // Carnê já persiste (carne_contratos/carne_parcelas).
    try{ DB.carne = await Dados.listarCarne(); }
    catch(e){ console.error('[ZelAuto] falha ao carregar carnê:', e); DB.carne=[];
      if(typeof toast==='function') toast('Não consegui carregar o carnê. Verifique a conexão e recarregue.'); }
    // Contratos já persiste (papelada).
    try{ DB.contratos = await Dados.listarContratos(); }
    catch(e){ console.error('[ZelAuto] falha ao carregar contratos:', e); DB.contratos=[]; }
    aplicarPermissoes();                            // nome, iniciais e menu por módulo
    const hj=document.getElementById('hojeLabel'); if(hj) hj.textContent = USER.papel;
    irGrupo('hoje');
    atualizarTags();
    // Gate de assinatura: loja suspensa (vencida além dos 3 dias) → bloqueia.
    try{ if(!(await Dados.lojaAtiva())) bloquearSuspensa(); }catch(_){}
    // Monitor de suporte: mostra o banner se houver acesso ativo (só o dono).
    try{ iniciarMonitorSuporte(); }catch(_){}
    // Botão flutuante de suporte: FAQ primeiro, chamado só se não resolveu.
    try{ montarSuporteFab(); }catch(_){}
    return true;
  }

  async function onSubmit(ev){
    ev.preventDefault();
    const btn=overlay.querySelector('#loginBtn');
    const emailEl=overlay.querySelector('#loginEmail');
    const senhaEl=overlay.querySelector('#loginSenha');
    if(!btn || !emailEl || !senhaEl) return;   // estado "sem link": não há formulário
    if(!window.Dados){ mostrarErro('Camada de dados não carregou (veja dados.config.js).'); return; }
    const email=emailEl.value.trim();
    const senha=senhaEl.value;
    const erroEl=overlay.querySelector('#loginErro'); if(erroEl) erroEl.style.display='none';
    btn.disabled=true; btn.textContent='Entrando…';
    try{
      await Dados.entrar(email, senha);
      if(await aplicarSessao()) esconderLogin();
      else mostrarErro('Login ok, mas não há perfil vinculado a este usuário.');
    }catch(e){
      mostrarErro('E-mail ou senha inválidos.');
    }finally{
      btn.disabled=false; btn.textContent='Entrar';
    }
  }

  window.sairDaConta = async function(){
    try{ if(window.Dados) await Dados.sair(); }catch(e){}
    location.reload();
  };

  // Entrada do suporte: o Console abre esta página com a credencial no hash.
  // Lemos, LIMPAMOS a URL na hora (para não ficar no histórico nem em print) e
  // devolvemos o que veio. Quem decide se o acesso vale é o banco, não isto:
  // o token de suporte só enxerga a loja enquanto `app.suporte_ativo` permitir.
  function credencialDeSuporte(){
    const h = location.hash || '';
    if(h.indexOf('#sup=') !== 0) return null;
    let dados = null;
    try{ dados = JSON.parse(decodeURIComponent(escape(atob(h.slice(5))))); }catch(_){ dados = null; }
    try{ history.replaceState(null, '', location.pathname + location.search); }
    catch(_){ location.hash = ''; }
    return (dados && dados.e && dados.s) ? dados : null;
  }

  // Faixa fixa no topo enquanto o operador está dentro da loja. Existe para o
  // operador nunca esquecer onde está, e para o print da tela dizer a verdade.
  function faixaModoSuporte(info){
    const barra = document.createElement('div');
    barra.id = 'supModoBar';
    barra.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:72;background:#E5484D;color:#fff;'
      + 'font-weight:700;font-size:13px;padding:8px 14px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap';
    barra.innerHTML = '<span>MODO SUPORTE — você está dentro da loja '
      + esc(info.n || '') + '. Tudo o que editar fica na auditoria como Suporte ZelAuto.</span>'
      + '<span id="supModoRelogio" style="font-variant-numeric:tabular-nums;opacity:.9"></span>';
    document.body.appendChild(barra);
    if(!info.x) return;
    const fim = new Date(info.x).getTime();
    const tick = () => {
      const r = Math.max(0, Math.floor((fim - Date.now()) / 1000));
      const el = document.getElementById('supModoRelogio');
      if(el) el.textContent = 'expira em ' + String(Math.floor(r/60)).padStart(2,'0') + ':' + String(r%60).padStart(2,'0');
      if(r <= 0) location.reload();                 // acabou o prazo: cai fora
    };
    tick(); setInterval(tick, 1000);
  }

  async function boot(){
    construirOverlay(); overlay.style.display='flex';
    const sup = credencialDeSuporte();
    const temSlug = !!slugDaUrl();
    if(!temSlug && !sup) montarSemLink();           // sem slug: página do link (não precisa de Dados)
    let tries=0;
    while(!window.Dados && tries<50){ await new Promise(r=>setTimeout(r,60)); tries++; }
    if(!window.Dados){ mostrarErro('Camada de dados não carregou. Crie app/dados.config.js (copie do .example) com a URL e a chave publishable.'); return; }

    if(sup){
      try{
        await Dados.entrar(sup.e, sup.s);
        if(await aplicarSessao()){ esconderLogin(); faixaModoSuporte(sup); return; }
        mostrarErro('Acesso de suporte sem perfil na loja.');
      }catch(e){ mostrarErro('Este acesso de suporte não vale mais. Peça um novo no Console.'); }
      return;
    }

    try{ if(await Dados.sessaoAtual() && await aplicarSessao()){ esconderLogin(); return; } }catch(e){}
    if(temSlug) pintarMarca();                       // sem sessão + com slug: pinta a marca (Dados já pronto)
  }
  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
