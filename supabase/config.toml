# =============================================================================
# ZelAuto — config.toml (configuração local do Supabase CLI)
#
# Só o necessário para as Edge Functions. O restante usa os defaults do CLI.
# =============================================================================

# A função `equipe` NÃO usa o verify_jwt da plataforma: com ele ligado, o
# preflight CORS (OPTIONS, que o navegador manda sem token) é rejeitado e a
# chamada do front quebra. A autenticação é feita DENTRO da função — ela lê o
# token do Authorization, confirma o usuário (auth.getUser) e exige que o perfil
# do chamador esteja ativo e seja proprietario/gerente. É verificação real, só
# no lugar certo.
[functions.equipe]
verify_jwt = false

# A função `custos` também verifica a autenticação por dentro (getUser + perfil).
[functions.custos]
verify_jwt = false

# A função `vender` grava a venda (custo congelado no servidor); auth por dentro.
[functions.vender]
verify_jwt = false

# A função `exportar-dados` gera o .zip da loja; auth por dentro (só proprietário).
[functions.exportar-dados]
verify_jwt = false

# A função `marca-loja` é PÚBLICA (anon): devolve só a marca por slug. Sem JWT.
[functions.marca-loja]
verify_jwt = false

# A função `admin` é o control plane: auth por dentro (getUser + membership em
# operadores). Só operador ZelAuto age aqui.
[functions.admin]
verify_jwt = false

# A função `site-loja` é o site PÚBLICO da loja (SSR, GET). Sem JWT. Devolve HTML
# só com campos públicos do estoque (nunca custo).
[functions.site-loja]
verify_jwt = false

# A função `cobranca` gera a cobrança do plano (AbacatePay). Auth por dentro
# (getUser + perfil proprietário). A chave da API é segredo de função.
[functions.cobranca]
verify_jwt = false

# A função `abacate-webhook` é PÚBLICA (a AbacatePay chama). A defesa é o segredo
# na URL (?webhookSecret=...), conferido por dentro. Sem JWT.
[functions.abacate-webhook]
verify_jwt = false

# `suporte`: control plane do suporte assistido (lado do OPERADOR). Auth por
# dentro (getUser + operadores). Abre a sessão de acesso ao painel, conversa no
# chamado e encerra. A função `suporte-dados`, que servia o painel só-leitura,
# foi aposentada na 0024: agora o operador entra no app de verdade.
[functions.suporte]
verify_jwt = false

# `suporte-chat` é o lado do LOJISTA: abre chamado, manda mensagem e autoriza o
# acesso ao painel. Auth por dentro (getUser + perfis ativo); o nome do autor é
# carimbado no servidor e é daqui que sai o e-mail para o operador.
[functions.suporte-chat]
verify_jwt = false
